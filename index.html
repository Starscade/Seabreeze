<!DOCTYPE html>
<html
	lang="en"
	oncontextmenu="return false"
>
	<head>
		<link
			href="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="
			rel="icon">
		<link
			href="manifest.json"
			rel="manifest"
		>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link
			href="https://fonts.googleapis.com/css2?family=Caacupe+One&display=swap"
			rel="stylesheet">
		<meta charset="UTF-8">
		<meta
			content="LightSkyBlue"
			name="theme-color"
		>
		<meta
			content="initial-scale=1,interactive-widget=resizes-content,maximum-scale=1,user-scalable=no,width=device-width"
			name="viewport"
		>
		<title>&#127758;</title>
		<style>
		body {
			margin: 0;
			overflow: hidden;
			background: #87CEEB;
			font-family: 'Caacupe One', sans-serif;
			font-size: 14pt;
			touch-action: none;
		}

		canvas {
			display: block;
		}

		.btn {
			width: 60px;
			height: 60px;
			background: rgba(255,255,255,0.3);
			border: 2px solid white;
			border-radius: 50%;
			color: white;
			font-weight: bold;
			display: flex;
			align-items: center;
			justify-content: center;
			user-select: none;
			cursor: pointer;
		}

		.joystick-container {
			position: absolute;
			bottom: 40px;
			width: 120px;
			height: 120px;
			background: rgba(255,255,255,0.2);
			border-radius: 50%;
			touch-action: none;
			border: 2px solid rgba(255,255,255,0.3);
			display: none; /* Hidden by default */
		}

		.knob {
			position: absolute;
			top: 35px;
			left: 35px;
			width: 50px;
			height: 50px;
			background: rgba(255,255,255,0.5);
			border-radius: 50%;
			pointer-events: none;
		}

		#altimeter {
			opacity: 0.9;
		}

		#compass {
			font-weight: bold;
			font-size: 2rem;
			letter-spacing: 2px;
			margin-bottom: 5px;
		}

		#game-clock {
			opacity: 0.9;
		}

		#height-controls {
			position: absolute;
			right: 40px;
			bottom: 180px;
			display: none; /* Hidden by default */
			flex-direction: column;
			gap: 10px;
		}

		#hud-stats {
			position: absolute;
			top: 1rem;
			left: 50%;
			transform: translateX(-50%);
			color: white;
			text-shadow: 1px 1px 2px black;
			pointer-events: none;
			text-align: center;
		}

		#look-joy {
			right: 40px;
		}

		#move-joy {
			left: 40px;
		}
		</style>
	</head>
	<body id="main-body">
		<div id="hud-stats">
			<div id="compass">N</div>
			<div id="game-clock">00:00</div>
			<div id="altimeter">0m</div>
		</div>

		<div id="move-joy" class="joystick-container">
			<div class="knob" id="move-knob"></div>
		</div>
		<div id="look-joy" class="joystick-container">
			<div class="knob" id="look-knob"></div>
		</div>
		<div id="height-controls">
			<div class="btn" id="btn-up">UP</div>
			<div class="btn" id="btn-down">DN</div>
		</div>

		<script
			src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>

		<script>
		const CYCLE_DURATION = 5 * 60000
		const scene = new THREE.Scene()

		const vertexShader = `
			varying vec3 vWorldPosition;
			void main() {
				vec4 worldPosition = modelMatrix * vec4(position, 1.0);
				vWorldPosition = worldPosition.xyz;
				gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
			}
		`
		const fragmentShader = `
			varying vec3 vWorldPosition;
			uniform vec3 uSkyColor;
			uniform vec3 uHorizonColor;
			void main() {
				float h = normalize(vWorldPosition).y;
				gl_FragColor = vec4(mix(uHorizonColor, uSkyColor, max(h, 0.0)), 1.0);
			}
		`
		const skyGeo = new THREE.SphereGeometry(500, 32, 15)
		const skyMat = new THREE.ShaderMaterial({
			uniforms: {
				uSkyColor: { value: new THREE.Color(0x84c7e9) },
				uHorizonColor: { value: new THREE.Color(0x87ceeb) },
			},
			vertexShader,
			fragmentShader,
			side: THREE.BackSide,
		})
		const sky = new THREE.Mesh(skyGeo, skyMat)
		scene.add(sky)

		const starGeo = new THREE.BufferGeometry()
		const starCount = 100
		const starPositions = new Float32Array(starCount * 3)
		for (let i = 0; i < starCount; i++) {
			const theta = Math.random() * Math.PI * 2
			const phi = Math.acos((Math.random() * 2) - 1)
			const radius = 480
			starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta)
			starPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta)
			starPositions[i * 3 + 2] = radius * Math.cos(phi)
		}
		starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3))

		const starMat = new THREE.ShaderMaterial({
			uniforms: {
				uOpacity: { value: 0 },
			},
			vertexShader: `
				varying float vY;
				void main() {
					vY = position.y;
					gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
					gl_PointSize = 2.0;
				}
			`,
			fragmentShader: `
				varying float vY;
				uniform float uOpacity;
				void main() {
					if (vY < 0.0) discard;
					gl_FragColor = vec4(1.0, 1.0, 1.0, uOpacity);
				}
			`,
			transparent: true,
			depthWrite: false,
		})
		const stars = new THREE.Points(starGeo, starMat)
		stars.material.fog = false
		scene.add(stars)

		// SUN SYSTEM
		const sunCanvas = document.createElement('canvas')
		sunCanvas.width = 256
		sunCanvas.height = 256
		const sctx = sunCanvas.getContext('2d')
		sctx.fillStyle = '#FFFFAA'
		sctx.beginPath()
		sctx.arc(128, 128, 100, 0, Math.PI * 2)
		sctx.fill()

		const sunTexture = new THREE.CanvasTexture(sunCanvas)
		const sunMat = new THREE.SpriteMaterial({
			map: sunTexture,
			transparent: true,
			depthTest: true,
		})
		const sun = new THREE.Sprite(sunMat)
		sun.material.fog = false
		sun.scale.set(48, 48, 1)
		scene.add(sun)

		const glowCanvas = document.createElement('canvas')
		glowCanvas.width = 64
		glowCanvas.height = 64
		const ctx = glowCanvas.getContext('2d')
		const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32)
		gradient.addColorStop(0, 'rgba(255, 255, 200, 1)')
		gradient.addColorStop(0.2, 'rgba(255, 255, 150, 0.5)')
		gradient.addColorStop(0.5, 'rgba(255, 200, 100, 0.1)')
		gradient.addColorStop(1, 'rgba(255, 200, 100, 0)')
		ctx.fillStyle = gradient
		ctx.fillRect(0, 0, 64, 64)

		const glowTexture = new THREE.CanvasTexture(glowCanvas)
		const glowMat = new THREE.SpriteMaterial({
			map: glowTexture,
			color: 0xfff5aa,
			transparent: true,
		})
		const sunGlow = new THREE.Sprite(glowMat)
		sunGlow.material.fog = false
		sunGlow.scale.set(150, 150, 1)
		scene.add(sunGlow)

		// MOON SYSTEM
		const moonCanvas = document.createElement('canvas')
		moonCanvas.width = 256
		moonCanvas.height = 256
		const mctx = moonCanvas.getContext('2d')
		mctx.translate(moonCanvas.width / 2, moonCanvas.height / 2)
		mctx.rotate(Math.PI / -4)
		mctx.globalCompositeOperation = 'source-over'
		mctx.fillStyle = '#ffffdd'
		mctx.beginPath()
		mctx.arc(0, 0, 100, 0, Math.PI * 2)
		mctx.fill()
		mctx.globalCompositeOperation = 'destination-out'
		mctx.beginPath()
		mctx.arc(50, 0, 100, 0, Math.PI * 2)
		mctx.fill()

		const moonTexture = new THREE.CanvasTexture(moonCanvas)
		const moonMat = new THREE.SpriteMaterial({
			map: moonTexture,
			transparent: true,
			opacity: 0,
			depthTest: true,
		})
		const moonCrescent = new THREE.Sprite(moonMat)
		moonCrescent.scale.set(50, 50, 1)
		const moonDist = 300
		moonCrescent.position.set(
			-moonDist * 0.707,
			moonDist * 0.707,
			-moonDist * 0.707,
		)
		moonCrescent.material.fog = false
		scene.add(moonCrescent)

		const moonLight = new THREE.DirectionalLight(0xccccff, 3)
		moonLight.position.copy(moonCrescent.position)
		scene.add(moonLight)

		const camera = new THREE.PerspectiveCamera(
			75,
			window.innerWidth / window.innerHeight,
			0.1,
			2000,
		)
		const renderer = new THREE.WebGLRenderer()
		renderer.setSize(window.innerWidth, window.innerHeight)
		renderer.setPixelRatio(window.devicePixelRatio)
		renderer.localClippingEnabled = true
		document.body.appendChild(renderer.domElement)

		scene.fog = new THREE.FogExp2(0x87CEEB, 0.01)
		renderer.setClearColor(0x87CEEB)

		const ambientLight = new THREE.AmbientLight(0xffffff, 2.0)
		scene.add(ambientLight)
		const directionalLight = new THREE.DirectionalLight(0xffffff, 2.0)
		scene.add(directionalLight)

		const diveLight = new THREE.SpotLight(0xffffff, 20)
		diveLight.distance = 30
		diveLight.angle = Math.PI / 2.5
		diveLight.penumbra = 0.2
		diveLight.decay = 1
		diveLight.visible = true
		scene.add(diveLight)
		scene.add(diveLight.target)

		const cloudMaterial = new THREE.MeshBasicMaterial({
			color: 0xeeeeff,
			transparent: true,
			opacity: 0.97,
			depthWrite: true,
		})

		const cloudGroup = new THREE.Group()
		scene.add(cloudGroup)

		const CLOUD_CHUNK_SIZE = 128
		const cloudChunks = new Map()
		let windOffset = 0
		const WIND_SPEED = 0.277

		function createCloudCluster(x, z, y) {
			const cluster = new THREE.Group()
			const puffCount = 5 + Math.floor(Math.random() * 10)
			for (let j = 0; j < puffCount; j++) {
				const size = 10 + Math.random() * 20
				const puffGeo = new THREE.SphereGeometry(size, 8, 8)
				const puff = new THREE.Mesh(puffGeo, cloudMaterial)
				puff.material.fog = true
				puff.position.set(
					(Math.random() - 0.5) * 40,
					(Math.random() - 0.5) * 20,
					(Math.random() - 0.5) * 40,
				)
				puff.scale.set(
					0.7 + Math.random() * 1.3,
					0.5 + Math.random() * 1.0,
					0.7 + Math.random() * 1.3,
				)
				cluster.add(puff)
			}
			cluster.position.set(x, y, z)
			return cluster
		}

		function updateClouds() {
			windOffset += WIND_SPEED * 0.016
			const px = Math.floor((camera.position.x + windOffset) / CLOUD_CHUNK_SIZE)
			const pz = Math.floor(camera.position.z / CLOUD_CHUNK_SIZE)

			for (let x = px - 3; x <= px + 3; x++) {
				for (let z = pz - 3; z <= pz + 3; z++) {
					const key = `${x},${z}`
					if (!cloudChunks.has(key)) {
						const chunk = new THREE.Group()
						const seed = Math.sin(x * 12.9898 + z * 78.233) * 43758.5453
						const cloudCount = Math.floor(Math.abs(seed) % 5)
						for (let i = 0; i < cloudCount; i++) {
							const cx = (Math.random() - 0.5) * CLOUD_CHUNK_SIZE
							const cz = (Math.random() - 0.5) * CLOUD_CHUNK_SIZE
							const cy = 60 + Math.random() * 60
							chunk.add(createCloudCluster(cx, cz, cy))
						}
						chunk.position.set(x * CLOUD_CHUNK_SIZE, 0, z * CLOUD_CHUNK_SIZE)
						cloudChunks.set(key, chunk)
						cloudGroup.add(chunk)
					}
				}
			}

			for (const [key, chunk] of cloudChunks.entries()) {
				const [cx, cz] = key.split(',').map(Number)
				if (Math.abs(cx - px) > 4 || Math.abs(cz - pz) > 4) {
					cloudGroup.remove(chunk)
					chunk.traverse((c) => {
						if (c.geometry) c.geometry.dispose()
					})
					cloudChunks.delete(key)
				}
			}
			cloudGroup.position.x = -windOffset
		}

		const renderTarget = new THREE.WebGLRenderTarget(
			window.innerWidth,
			window.innerHeight,
		)
		const postScene = new THREE.Scene()
		const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1)
		const postQuad = new THREE.PlaneGeometry(2, 2)

		const underwaterMaterial = new THREE.ShaderMaterial({
			uniforms: {
				tDiffuse: { value: null },
				uTime: { value: 0 },
				uUnderwater: { value: 0 },
			},
			vertexShader: `
				varying vec2 vUv;
				void main() {
					vUv = uv;
					gl_Position = vec4(position, 1.0);
				}
			`,
			fragmentShader: `
				uniform sampler2D tDiffuse;
				uniform float uTime;
				uniform float uUnderwater;
				varying vec2 vUv;
				void main() {
					vec2 uv = vUv;
					if (uUnderwater > 0.5) {
						float ripple = sin(uv.y * 20.0 + uTime * 2.0) * 0.005;
						ripple += cos(uv.x * 15.0 + uTime * 1.5) * 0.003;
						uv += ripple;
						vec4 color = texture2D(tDiffuse, uv);
						vec3 tint = vec3(0.2, 0.5, 0.8);
						color.rgb = mix(color.rgb, tint, 0.4);
						gl_FragColor = color;
					} else {
						gl_FragColor = texture2D(tDiffuse, uv);
					}
				}
			`,
		})
		const postMesh = new THREE.Mesh(postQuad, underwaterMaterial)
		postScene.add(postMesh)

		let yaw = 0, pitch = 0
		document.addEventListener('mousemove', (e) => {
			if (document.pointerLockElement === document.body) {
				yaw -= e.movementX * 0.002
				pitch -= e.movementY * 0.002
				pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch))
				camera.rotation.set(pitch, yaw, 0, 'YXZ')
			}
		})

		document.addEventListener('click', (e) => {
			if (e.target.classList.contains('btn')) return
			document.body.requestPointerLock()
		})

		function simplexNoise(x, z, seed) {
			return (
				Math.sin(x * 0.05 + seed) * Math.cos(z * 0.05 + seed) * -10 +
				Math.sin(x * 0.2 + seed * 1.1) * Math.cos(z * 0.2 + seed * 1.2) * -5 +
				Math.sin(x * 0.01 + seed * 0.5) * Math.sin(z * 0.01 + seed * 0.8) * 30 +
				Math.cos(x * 0.1 + z * 0.01 + seed) * -8
			)
		}

		const CHUNK_SIZE = 64
		const CHUNK_RES = 32
		const RENDER_DISTANCE = 3
		const chunks = new Map()
		const seedOffset = Math.random() * 1000
		const colorSnow = new THREE.Color(0xeeeeff)
		const colorGrass = new THREE.Color(0x5db03a)
		const colorSand = new THREE.Color(0xf0d0b0)
		const colorClay = new THREE.Color(0x9a5a2a)
		const colorRock = new THREE.Color(0x4b2d18)

		const terrainClippingPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 1)

		const trunkMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 })
		const leafMat = new THREE.MeshLambertMaterial({ color: 0x228B22 })
		const boulderMat = new THREE.MeshLambertMaterial({ color: 0xaaaaaa })

		// HELPER FOR CONSISTENT HEIGHT CALCULATION
		function getTerrainHeight(x, z) {
			const rawHeight = simplexNoise(x, z, seedOffset);
			if (rawHeight < 0) {
				return (rawHeight * 0.5) - 30;
			} else if (rawHeight < -15) {
				return (rawHeight * 1.0) - 50;
			} else {
				return (rawHeight * 1.0) - 15;
			}
		}

		function createTree(x, y, z) {
			const group = new THREE.Group()
			const trunkGeo = new THREE.CylinderGeometry(0.2, 0.4, 6, 3)
			const trunk = new THREE.Mesh(trunkGeo, trunkMat)
			trunk.position.y = 2.5
			group.add(trunk)

			const leafGeo = new THREE.ConeGeometry(2, 7, 3)
			const leaf = new THREE.Mesh(leafGeo, leafMat)
			leaf.scale.set(1.2, 0.8, 1.2)
			leaf.position.set(0, 6, 0)
			group.add(leaf)

			group.position.set(x, y, z)
			return group
		}

		function createBoulder(x, y, z) {
			const boulderGeo = new THREE.SphereGeometry(
				Math.max(0.3, 2 * Math.random()),
				6,
				3,
			)
			const boulder = new THREE.Mesh(boulderGeo, boulderMat)
			boulder.position.set(x, y + 0.15, z)
			boulder.scale.set(1, 0.7, 1)
			return boulder
		}

		function createChunk(cx, cz) {
			const geo = new THREE.PlaneGeometry(
				CHUNK_SIZE,
				CHUNK_SIZE,
				CHUNK_RES,
				CHUNK_RES,
			)
			geo.rotateX(-Math.PI / 2)
			const vertices = geo.attributes.position.array
			const colors = []
			const chunkGroup = new THREE.Group()

			for (let i = 0; i < vertices.length; i += 3) {
				const worldX = vertices[i] + cx * CHUNK_SIZE
				const worldZ = vertices[i + 2] + cz * CHUNK_SIZE
				let height = getTerrainHeight(worldX, worldZ)
				vertices[i + 1] = height
				const c = new THREE.Color()
				if (height > 20) c.copy(colorSnow)
				else if (height > 2) c.copy(colorGrass)
				else if (height > -2) c.copy(colorSand)
				else if (height > -20) c.copy(colorClay)
				else c.copy(colorRock)
				colors.push(c.r, c.g, c.b)

				if (Math.random() < 0.1 && height < 15) {
					if (height > 3) {
						const tree = createTree(worldX, height, worldZ)
						chunkGroup.add(tree)
					} else if (height > -1 && Math.random() < 0.01) {
						const tree = createTree(worldX, height, worldZ)
						chunkGroup.add(tree)
					}
				}
				if (Math.random() < 0.01 && height > -20) {
					chunkGroup.add(createBoulder(worldX, height, worldZ))
				}
			}
			geo.computeVertexNormals()
			geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3))
			const mat = new THREE.MeshLambertMaterial({
				vertexColors: true,
				side: THREE.DoubleSide,
				clippingPlanes: [terrainClippingPlane],
			})
			const mesh = new THREE.Mesh(geo, mat)
			mesh.position.set(cx * CHUNK_SIZE, 0, cz * CHUNK_SIZE)

			const container = new THREE.Group()
			container.add(mesh)
			container.add(chunkGroup)
			scene.add(container)
			return container
		}

		function updateChunks() {
			const px = Math.floor(camera.position.x / CHUNK_SIZE)
			const pz = Math.floor(camera.position.z / CHUNK_SIZE)
			for (let x = px - RENDER_DISTANCE; x <= px + RENDER_DISTANCE; x++) {
				for (let z = pz - RENDER_DISTANCE; z <= pz + RENDER_DISTANCE; z++) {
					const key = `${x},${z}`
					if (!chunks.has(key)) chunks.set(key, createChunk(x, z))
				}
			}
			for (const [key, group] of chunks.entries()) {
				const [cx, cz] = key.split(',').map(Number)
				if (
					Math.abs(cx - px) > RENDER_DISTANCE + 1 ||
					Math.abs(cz - pz) > RENDER_DISTANCE + 1
				) {
					scene.remove(group)
					group.traverse((child) => {
						if (child.geometry) child.geometry.dispose()
						if (child.material) child.material.dispose()
					})
					chunks.delete(key)
				}
			}
		}

		camera.position.set(0, 10, 0)

		// OCEAN SURFACE WITH DEPTH COLORING
		const oceanGeo = new THREE.PlaneGeometry(1000, 1000, 768, 768)
		oceanGeo.rotateX(-Math.PI / 2)
		const oceanMat = new THREE.ShaderMaterial({
			uniforms: {
				uTime: { value: 0 },
				uFogColor: { value: new THREE.Color(0x87ceeb) },
				uFogDensity: { value: 0.02 },
				uSeed: { value: seedOffset },
			},
			vertexShader: `
				uniform float uTime;
				uniform float uSeed;
				varying float vHeight;
				varying vec3 vWorldPosition;
				varying float vDepth;

				float getTerrainHeight(float x, float z) {
					float seed = uSeed;
					float rawHeight = (
						sin(x * 0.05 + seed) * cos(z * 0.05 + seed) * -10.0 +
						sin(x * 0.2 + seed * 1.1) * cos(z * 0.2 + seed * 1.2) * -5.0 +
						sin(x * 0.01 + seed * 0.5) * sin(z * 0.01 + seed * 0.8) * 30.0 +
						cos(x * 0.1 + z * 0.01 + seed) * -8.0
					);
					if (rawHeight < 0.0) {
						return (rawHeight * 0.3) - 15.0;
					} else {
						return (rawHeight * 1.0) - 15.0;
					}
				}

				void main() {
					vec3 pos = position;
					float h = sin(pos.x * 0.05 + uTime) * 0.4 + cos(pos.z * 0.07 + uTime * 1.2) * 0.4;
					pos.y += h;
					vHeight = h;
					
					vec4 worldPos = modelMatrix * vec4(pos, 1.0);
					vWorldPosition = worldPos.xyz;
					
					float finalTerrainH = getTerrainHeight(vWorldPosition.x, vWorldPosition.z);
					vDepth = vWorldPosition.y - finalTerrainH;

					gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
				}
			`,
			fragmentShader: `
				uniform vec3 uFogColor;
				uniform float uFogDensity;
				varying float vHeight;

		function setupJoystick(containerId, knobId, callback) {
			const container = document.getElementById(containerId)
			const knob = document.getElementById(knobId)
			let activeTouchId = null
			const handleTouch = (e) => {
				e.preventDefault()
				let touch = null
				for (let i = 0; i < e.touches.length; i++) {
					if (e.touches[i].identifier === activeTouchId) {
						touch = e.touches[i]
						break
					}
				}
				if (!touch) return
				const rect = container.getBoundingClientRect()
				const centerX = rect.left + rect.width / 2
				const centerY = rect.top + rect.height / 2
				let dx = touch.clientX - centerX
				let dy = touch.clientY - centerY
				const distance = Math.sqrt(dx * dx + dy * dy)
				const maxRadius = rect.width / 2
				if (distance > maxRadius) {
					dx *= maxRadius / distance
					dy *= maxRadius / distance
				}
				knob.style.transform = `translate(${dx}px, ${dy}px)`
				callback(dx / maxRadius, dy / maxRadius)
			}
			container.addEventListener('touchstart', (e) => {
				e.preventDefault()
				const touch = e.changedTouches[0]
				activeTouchId = touch.identifier
				handleTouch(e)
			})
			container.addEventListener('touchmove', (e) => {
				if (activeTouchId !== null) handleTouch(e)
			}, { passive: false })
			container.addEventListener('touchend', (e) => {
				for (let i = 0; i < e.changedTouches.length; i++) {
					if (e.changedTouches[i].identifier === activeTouchId) {
						activeTouchId = null
						knob.style.transform = `translate(0, 0)`
						callback(0, 0)
					}
				}
			})
		}

			else if (normalizedDeg >= 22.5 && normalizedDeg < 67.5) dir = 'NE'
			else if (normalizedDeg >= 67.5 && normalizedDeg < 112.5) dir = 'E'
			else if (normalizedDeg >= 112.5 && normalizedDeg < 157.5) dir = 'SE'
			else if (normalizedDeg >= 157.5 && normalizedDeg < 202.5) dir = 'S'
			else if (normalizedDeg >= 202.5 && normalizedDeg < 247.5) dir = 'SW'
			else if (normalizedDeg >= 247.5 && normalizedDeg < 292.5) dir = 'W'

			if (isUnderwater) {
				const underwaterDayColor = new THREE.Color(0x5b94b0)
				const underwaterNightColor = new THREE.Color(0x020a15)
				const currentUnderwaterColor = new THREE.Color().lerpColors(
					underwaterNightColor,
					underwaterDayColor,
					dayIntensity,
				)
				scene.fog = new THREE.FogExp2(currentUnderwaterColor, 0.1)
				renderer.setClearColor(currentUnderwaterColor)

				oceanMat.uniforms.uFogColor.value.copy(currentUnderwaterColor)
				oceanMat.uniforms.uFogDensity.value = 0.1

				rain.visible = false
				sky.visible = false
				stars.visible = false
				moonCrescent.visible = false
				diveLight.visible = true
				diveLight.position.copy(camera.position)
				const targetPos = new THREE.Vector3(0, 0, -1).applyQuaternion(
					camera.quaternion,
				).add(camera.position)
				diveLight.target.position.copy(targetPos)
				terrainClippingPlane.constant = 1000
				underwaterMaterial.uniforms.uUnderwater.value = 1.0
			} else {
				scene.fog = new THREE.FogExp2(currentFogColor, 0.01)
				renderer.setClearColor(currentFogColor)

				oceanMat.uniforms.uFogColor.value.copy(currentFogColor)
				oceanMat.uniforms.uFogDensity.value = 0.02

				rain.visible = true
				sky.visible = true
				stars.visible = true
				diveLight.visible = true
				diveLight.position.copy(camera.position)
				const targetPos = new THREE.Vector3(0, 0, -1).applyQuaternion(
					camera.quaternion,
				).add(camera.position)
				diveLight.target.position.copy(targetPos)
				terrainClippingPlane.constant = 2
				underwaterMaterial.uniforms.uUnderwater.value = 0.0
			}

			underwaterMaterial.uniforms.uTime.value = time * 0.001

			velocity.x -= velocity.x * 10.0 * delta
			velocity.y -= velocity.y * 10.0 * delta
			velocity.z -= velocity.z * 10.0 * delta

			const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion)
			const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion)
			const up = new THREE.Vector3(0, 1, 0)

			const moveZ = (moveForward ? 1 : 0) - (moveBackward ? 1 : 0) - joyY
			const moveX = (moveRight ? 1 : 0) - (moveLeft ? 1 : 0) + joyX
			const speedMultiplier = isSprinting ? 4 : 1
			const currentSpeed = 80 * speedMultiplier

			if (moveZ !== 0) {
				velocity.add(forward.clone().multiplyScalar(moveZ * currentSpeed * delta))
			}
			if (moveX !== 0) {
				velocity.add(right.clone().multiplyScalar(moveX * currentSpeed * delta))
			}
			if (moveUp) velocity.add(up.clone().multiplyScalar(currentSpeed * delta))
			if (moveDown) velocity.add(up.clone().multiplyScalar(-currentSpeed * delta))

			const nextPos = camera.position.clone().add(
				velocity.clone().multiplyScalar(delta),
			)

			const terrainCollisionHeight = 1 + getTerrainHeight(nextPos.x, nextPos.z)
			if (nextPos.y < terrainCollisionHeight) {
				nextPos.y = terrainCollisionHeight
				velocity.set(0, 0, 0)
			}

			camera.position.copy(nextPos)
			sky.position.copy(camera.position)
			stars.position.copy(camera.position)
			moonCrescent.position.copy(camera.position).add(
				new THREE.Vector3(-moonDist * 0.707, moonDist * 0.707, -moonDist * 0.707),
			)

			const rainPositions = rainGeo.attributes.position.array
			for (let i = 0; i < rainCount; i++) {
				rainPositions[i * 3 + 1] -= rainVel[i] * delta
				if (rainPositions[i * 3 + 1] < -RAIN_BOUNDS) {
					rainPositions[i * 3 + 1] = RAIN_BOUNDS
					rainPositions[i * 3] = (Math.random() - 0.5) * RAIN_BOUNDS * 2
					rainPositions[i * 3 + 2] = (Math.random() - 0.5) * RAIN_BOUNDS * 2
				}
			}
			rainGeo.attributes.position.needsUpdate = true
			rain.position.copy(camera.position)

			updateChunks()
			updateClouds()
			updateBoats(delta)
			updateBirds(delta, time)
			updateFish(delta, time)
			updateHUD(time)
			updateAudio()

			renderer.setRenderTarget(renderTarget)
			renderer.render(scene, camera)
			renderer.setRenderTarget(null)
			underwaterMaterial.uniforms.tDiffuse.value = renderTarget.texture
			renderer.render(postScene, postCamera)

			prevTime = now
		}
		animateFixed()

		window.addEventListener('resize', () => {
			camera.aspect = window.innerWidth / window.innerHeight
			camera.updateProjectionMatrix()
			renderer.setSize(window.innerWidth, window.innerHeight)
			renderTarget.setSize(window.innerWidth, window.innerHeight)
		})

		window.addEventListener('pointerlockchange', () => {
			const isLocked = document.pointerLockElement === document.body
			const elements = ['move-joy', 'look-joy', 'height-controls']
			elements.forEach((id) => {
				const el = document.getElementById(id)
				if (el) {
					const isTouch = 'ontouchstart' in window
					el.style.display = (isLocked || !isTouch) ? 'none' : 'block'
				}
			})
		})

		if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
			document.getElementById('move-joy').style.display = 'block'
			document.getElementById('look-joy').style.display = 'block'
			document.getElementById('height-controls').style.display = 'flex'
		}

		navigator.serviceWorker.register('work.js')
		</script>
	</body>
</html>
