<!DOCTYPE html>
<html lang="en">
<head>
    <title>GaiaCraft Minimal</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 1px 1px 2px black; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">WASD: Move | Space: Jump | Left Click: Destroy | Right Click: Place</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        
        const vertexShader = `
            varying vec3 vWorldPosition;
            void main() {
                vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                vWorldPosition = worldPosition.xyz;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;
        const fragmentShader = `
            varying vec3 vWorldPosition;
            void main() {
                float h = normalize(vWorldPosition).y;
                vec3 skyColor = vec3(0.529, 0.808, 0.922);
                vec3 horizonColor = vec3(0.7, 0.85, 1.0);
                gl_FragColor = vec4(mix(horizonColor, skyColor, max(h, 0.0)), 1.0);
            }
        `;
        const skyGeo = new THREE.SphereGeometry(500, 32, 15);
        const skyMat = new THREE.ShaderMaterial({ vertexShader, fragmentShader, side: THREE.BackSide });
        const sky = new THREE.Mesh(skyGeo, skyMat);
        scene.add(sky);

        const sunGeo = new THREE.SphereGeometry(5, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xFFFFAA });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        sun.position.set(100, 80, -200);
        scene.add(sun);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xcccccc, 0.9);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight.position.copy(sun.position);
        scene.add(directionalLight);

        let yaw = 0, pitch = 0;
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                camera.rotation.set(pitch, yaw, 0, 'YXZ');
            }
        });

        document.body.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const grassMat = new THREE.MeshLambertMaterial({ color: 0x4d8a31 });
        const dirtMat = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
        const sandMat = new THREE.MeshLambertMaterial({ color: 0xedc9af });
        const waterMat = new THREE.MeshLambertMaterial({ color: 0x0077be, transparent: true, opacity: 0.7 });
        
        const world = [];
        const size = 30;
        
        for(let x = -size; x < size; x++) {
            for(let z = -size; z < size; z++) {
                // Simple pseudo-random height using sine waves for island effect
                const dist = Math.sqrt(x*x + z*z);
                const height = Math.floor(
                    Math.sin(x * 0.2) * 2 + 
                    Math.cos(z * 0.2) * 2 + 
                    (10 - dist * 0.3) * 2
                );

                for(let y = -5; y <= height; y++) {
                    let mat = dirtMat;
                    if (y === height && y > -1) mat = grassMat;
                    if (y === height && y <= -1) mat = sandMat;
                    
                    const cube = new THREE.Mesh(geometry, mat);
                    cube.position.set(x, y, z);
                    scene.add(cube);
                    world.push(cube);
                }

                // Water level at y = -1
                if (height < -1) {
                    const water = new THREE.Mesh(geometry, waterMat);
                    water.position.set(x, -1, z);
                    scene.add(water);
                    world.push(water);
                }
            }
        }

        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let velocity = new THREE.Vector3();
        
        document.addEventListener('keydown', (e) => {
            if(e.code === 'KeyW') moveForward = true;
            if(e.code === 'KeyS') moveBackward = true;
            if(e.code === 'KeyA') moveLeft = true;
            if(e.code === 'KeyD') moveRight = true;
            if(e.code === 'Space' && canJump) { velocity.y += 5; canJump = false; }
        });
        document.addEventListener('keyup', (e) => {
            if(e.code === 'KeyW') moveForward = false;
            if(e.code === 'KeyS') moveBackward = false;
            if(e.code === 'KeyA') moveLeft = false;
            if(e.code === 'KeyD') moveRight = false;
        });

        const raycaster = new THREE.Raycaster();
        window.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement !== document.body) return;
            
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const intersects = raycaster.intersectObjects(world);
            
            if(intersects.length > 0) {
                const intersect = intersects[0];
                if(e.button === 0) {
                    scene.remove(intersect.object);
                    world.splice(world.indexOf(intersect.object), 1);
                } else if(e.button === 2) {
                    const pos = intersect.object.position.clone().add(intersect.face.normal);
                    const cube = new THREE.Mesh(geometry, dirtMat);
                    cube.position.copy(pos);
                    scene.add(cube);
                    world.push(cube);
                }
            }
        });
        window.addEventListener('contextmenu', e => e.preventDefault());

        camera.position.set(0, 10, 0);
        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= 9.8 * 1.5 * delta;

            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            forward.y = 0; forward.normalize();
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            right.y = 0; right.normalize();

            if (moveForward) velocity.add(forward.multiplyScalar(40 * delta));
            if (moveBackward) velocity.add(forward.multiplyScalar(-40 * delta));
            if (moveLeft) velocity.add(right.multiplyScalar(-40 * delta));
            if (moveRight) velocity.add(right.multiplyScalar(40 * delta));

            camera.position.add(velocity.clone().multiplyScalar(delta));

            if (camera.position.y < 2) {
                velocity.y = 0;
                camera.position.y = 2;
                canJump = true;
            }

            renderer.render(scene, camera);
            prevTime = time;
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
