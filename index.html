<!DOCTYPE html>
<html lang="en">
<head>
    <title>GaiaCraft Minimal</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 1px 1px 2px black; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">WASD: Move | Q/E: Up/Down | Left Click: Destroy | Right Click: Place</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        
        const vertexShader = `
            varying vec3 vWorldPosition;
            void main() {
                vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                vWorldPosition = worldPosition.xyz;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;
        const fragmentShader = `
            varying vec3 vWorldPosition;
            void main() {
                float h = normalize(vWorldPosition).y;
                vec3 skyColor = vec3(0.529, 0.808, 0.922);
                vec3 horizonColor = vec3(0.7, 0.85, 1.0);
                gl_FragColor = vec4(mix(horizonColor, skyColor, max(h, 0.0)), 1.0);
            }
        `;
        const skyGeo = new THREE.SphereGeometry(500, 32, 15);
        const skyMat = new THREE.ShaderMaterial({ vertexShader, fragmentShader, side: THREE.BackSide });
        const sky = new THREE.Mesh(skyGeo, skyMat);
        scene.add(sky);

        const sunGeo = new THREE.SphereGeometry(5, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xFFFFAA });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        sun.position.set(100, 80, -200);
        scene.add(sun);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xcccccc, 0.9);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight.position.copy(sun.position);
        scene.add(directionalLight);

        let yaw = 0, pitch = 0;
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                camera.rotation.set(pitch, yaw, 0, 'YXZ');
            }
        });

        document.body.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const grassMat = new THREE.MeshLambertMaterial({ color: 0x4d8a31 });
        const dirtMat = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
        const sandMat = new THREE.MeshLambertMaterial({ color: 0xedc9af });
        const waterMat = new THREE.MeshLambertMaterial({ color: 0x0077be, transparent: true, opacity: 0.7 });
        
        const world = [];
        const size = 30;
        let maxWorldHeight = -5;

        // Use InstancedMesh for high performance rendering of identical blocks
        function createInstancedMesh(material, blocks) {
            const mesh = new THREE.InstancedMesh(geometry, material, blocks.length);
            const matrix = new THREE.Matrix4();
            blocks.forEach((pos, i) => {
                matrix.setPosition(pos.x, pos.y, pos.z);
                mesh.setMatrixAt(i, matrix);
            });
            scene.add(mesh);
            return mesh;
        }

        const blockGroups = {
            grass: [],
            dirt: [],
            sand: [],
            water: []
        };

        for(let x = -size; x < size; x++) {
            for(let z = -size; z < size; z++) {
                const dist = Math.sqrt(x*x + z*z);
                const height = Math.floor(
                    Math.sin(x * 0.2) * 2 + 
                    Math.cos(z * 0.2) * 2 + 
                    (10 - dist * 0.3) * 2
                );
                if (height > maxWorldHeight) maxWorldHeight = height;

                for(let y = -5; y <= height; y++) {
                    let type = 'dirt';
                    if (y === height && y > -1) type = 'grass';
                    if (y === height && y <= -1) type = 'sand';
                    blockGroups[type].push({x, y, z});
                }

                if (height < -1) {
                    blockGroups.water.push({x, y: -1, z});
                }
            }
        }

        // Performance: Combine static geometry into InstancedMeshes
        const instancedMeshes = {
            grass: createInstancedMesh(grassMat, blockGroups.grass),
            dirt: createInstancedMesh(dirtMat, blockGroups.dirt),
            sand: createInstancedMesh(sandMat, blockGroups.sand),
            water: createInstancedMesh(waterMat, blockGroups.water)
        };

        // For raycasting/editing, we still need a lightweight representation
        const colliderWorld = [];
        Object.keys(blockGroups).forEach(type => {
            blockGroups[type].forEach(p => {
                const dummy = new THREE.Mesh(geometry);
                dummy.position.set(p.x, p.y, p.z);
                dummy.userData.type = type;
                colliderWorld.push(dummy);
            });
        });

        camera.position.set(0, maxWorldHeight + 5, 0);

        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, moveUp = false, moveDown = false;
        let velocity = new THREE.Vector3();
        
        document.addEventListener('keydown', (e) => {
            if(e.code === 'KeyW') moveForward = true;
            if(e.code === 'KeyS') moveBackward = true;
            if(e.code === 'KeyA') moveLeft = true;
            if(e.code === 'KeyD') moveRight = true;
            if(e.code === 'KeyE') moveUp = true;
            if(e.code === 'KeyQ') moveDown = true;
        });
        document.addEventListener('keyup', (e) => {
            if(e.code === 'KeyW') moveForward = false;
            if(e.code === 'KeyS') moveBackward = false;
            if(e.code === 'KeyA') moveLeft = false;
            if(e.code === 'KeyD') moveRight = false;
            if(e.code === 'KeyE') moveUp = false;
            if(e.code === 'KeyQ') moveDown = false;
        });

        const raycaster = new THREE.Raycaster();
        window.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement !== document.body) return;
            
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const intersects = raycaster.intersectObjects(colliderWorld);
            
            if(intersects.length > 0) {
                const intersect = intersects[0];
                if(e.button === 0) {
                    // Basic block removal from collider
                    scene.remove(intersect.object);
                    colliderWorld.splice(colliderWorld.indexOf(intersect.object), 1);
                    // Note: To truly remove from InstancedMesh, one would need to rebuild the instance or scale to 0
                } else if(e.button === 2) {
                    const pos = intersect.object.position.clone().add(intersect.face.normal);
                    const cube = new THREE.Mesh(geometry, dirtMat);
                    cube.position.copy(pos);
                    scene.add(cube);
                    colliderWorld.push(cube);
                }
            }
        });
        window.addEventListener('contextmenu', e => e.preventDefault());

        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            velocity.x -= velocity.x * 10.0 * delta;
            velocity.y -= velocity.y * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            const up = new THREE.Vector3(0, 1, 0);

            if (moveForward) velocity.add(forward.clone().multiplyScalar(40 * delta));
            if (moveBackward) velocity.add(forward.clone().multiplyScalar(-40 * delta));
            if (moveLeft) velocity.add(right.clone().multiplyScalar(-40 * delta));
            if (moveRight) velocity.add(right.clone().multiplyScalar(40 * delta));
            if (moveUp) velocity.add(up.clone().multiplyScalar(40 * delta));
            if (moveDown) velocity.add(up.clone().multiplyScalar(-40 * delta));

            camera.position.add(velocity.clone().multiplyScalar(delta));

            renderer.render(scene, camera);
            prevTime = time;
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
