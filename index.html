<!DOCTYPE html>
<html lang="en">
<head>
    <title>GaiaCraft LowPoly</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 1px 1px 2px black; pointer-events: none; }
    </style>
</head>
<body style="cursor: crosshair;">
    <div id="ui">WASD: Move | Q/E: Up/Down | Fly Mode</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        
        const vertexShader = `
            varying vec3 vWorldPosition;
            void main() {
                vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                vWorldPosition = worldPosition.xyz;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;
        const fragmentShader = `
            varying vec3 vWorldPosition;
            void main() {
                float h = normalize(vWorldPosition).y;
                vec3 skyColor = vec3(0.529, 0.808, 0.922);
                vec3 horizonColor = vec3(0.7, 0.85, 1.0);
                gl_FragColor = vec4(mix(horizonColor, skyColor, max(h, 0.0)), 1.0);
            }
        `;
        const skyGeo = new THREE.SphereGeometry(500, 32, 15);
        const skyMat = new THREE.ShaderMaterial({ vertexShader, fragmentShader, side: THREE.BackSide });
        const sky = new THREE.Mesh(skyGeo, skyMat);
        scene.add(sky);

        const sunGeo = new THREE.SphereGeometry(5, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xFFFFAA });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        sun.position.set(100, 80, -200);
        sun.material.fog = false; // Disable fog for the sun material
        scene.add(sun);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        scene.fog = new THREE.FogExp2(0x87CEEB, 0.01);
        renderer.setClearColor(0x87CEEB);

        const ambientLight = new THREE.AmbientLight(0xcccccc, 0.8);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight.position.copy(sun.position);
        scene.add(directionalLight);

        let yaw = 0, pitch = 0;
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                camera.rotation.set(pitch, yaw, 0, 'YXZ');
            }
        });

        document.body.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        function simplexNoise(x, z, seed) {
            return Math.sin(x * 0.1 + seed) * Math.cos(z * 0.1 + seed) * 2 +
                   Math.sin(x * 0.05 + seed) * Math.cos(z * 0.05 + seed) * 4 +
                   Math.sin(x * 0.02 + seed) * Math.sin(z * 0.02 + seed) * 6;
        }

        function generateTerrain() {
            const size = 200;
            const segments = 60; 
            const geo = new THREE.PlaneGeometry(size, size, segments, segments);
            geo.rotateX(-Math.PI / 2);

            const vertices = geo.attributes.position.array;
            const colors = [];
            const colorGrass = new THREE.Color(0x4d8a31);
            const colorSand = new THREE.Color(0xedc9af);
            const colorDirt = new THREE.Color(0x8b4513);

            const islands = [
                { x: 0, z: 0, r: 30, s: 1.2 },
                { x: 50, z: 40, r: 15, s: 2.3 },
                { x: -60, z: -20, r: 20, s: 3.4 },
                { x: 30, z: -60, r: 12, s: 4.5 }
            ];

            for (let i = 0; i < vertices.length; i += 3) {
                const x = vertices[i];
                const z = vertices[i + 2];
                
                let height = simplexNoise(x, z, 50) * 0.5 - 5; 
                
                islands.forEach(isl => {
                    const dx = x - isl.x;
                    const dz = z - isl.z;
                    const dist = Math.sqrt(dx*dx + dz*dz);
                    if (dist < isl.r) {
                        const mask = (isl.r - dist) / isl.r;
                        const noiseVal = simplexNoise(x, z, isl.s);
                        height += (noiseVal * mask * 3 + mask * 5);
                    }
                });

                vertices[i + 1] = height;

                const c = new THREE.Color();
                if (height > 1) c.copy(colorGrass);
                else if (height > -1) c.copy(colorSand);
                else c.copy(colorDirt);
                
                colors.push(c.r, c.g, c.b);
            }

            geo.computeVertexNormals();
            geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const mat = new THREE.MeshLambertMaterial({ 
                vertexColors: true, 
                flatShading: true 
            });
            
            const terrain = new THREE.Mesh(geo, mat);
            scene.add(terrain);
        }

        generateTerrain();

        const waterGeo = new THREE.PlaneGeometry(1000, 1000);
        const waterMat = new THREE.MeshLambertMaterial({ 
            color: 0x001a33, 
            transparent: true, 
            opacity: 0.8 
        });
        const ocean = new THREE.Mesh(waterGeo, waterMat);
        ocean.rotation.x = -Math.PI / 2;
        ocean.position.y = -1;
        scene.add(ocean);

        camera.position.set(0, 10, 0);

        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, moveUp = false, moveDown = false;
        let velocity = new THREE.Vector3();
        
        document.addEventListener('keydown', (e) => {
            if(e.code === 'KeyW') moveForward = true;
            if(e.code === 'KeyS') moveBackward = true;
            if(e.code === 'KeyA') moveLeft = true;
            if(e.code === 'KeyD') moveRight = true;
            if(e.code === 'KeyE') moveUp = true;
            if(e.code === 'KeyQ') moveDown = true;
        });
        document.addEventListener('keyup', (e) => {
            if(e.code === 'KeyW') moveForward = false;
            if(e.code === 'KeyS') moveBackward = false;
            if(e.code === 'KeyA') moveLeft = false;
            if(e.code === 'KeyD') moveRight = false;
            if(e.code === 'KeyE') moveUp = false;
            if(e.code === 'KeyQ') moveDown = false;
        });

        let prevTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            
            if (camera.position.y < -1) {
                scene.fog = new THREE.FogExp2(0x000b1a, 0.3);
                renderer.setClearColor(0x000b1a);
                sky.visible = false;
            } else {
                scene.fog = new THREE.FogExp2(0x87CEEB, 0.01);
                renderer.setClearColor(0x87CEEB);
                sky.visible = true;
            }

            velocity.x -= velocity.x * 10.0 * delta;
            velocity.y -= velocity.y * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            const up = new THREE.Vector3(0, 1, 0);
            
            if (moveForward) velocity.add(forward.clone().multiplyScalar(40 * delta));
            if (moveBackward) velocity.add(forward.clone().multiplyScalar(-40 * delta));
            if (moveLeft) velocity.add(right.clone().multiplyScalar(-40 * delta));
            if (moveRight) velocity.add(right.clone().multiplyScalar(40 * delta));
            if (moveUp) velocity.add(up.clone().multiplyScalar(40 * delta));
            if (moveDown) velocity.add(up.clone().multiplyScalar(-40 * delta));
            
            camera.position.add(velocity.clone().multiplyScalar(delta));
            renderer.render(scene, camera);
            prevTime = time;
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
