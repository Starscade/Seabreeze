<!DOCTYPE html>
<html
	lang="en"
	oncontextmenu="return false"
>
	<head>
		<link
			href="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="
			rel="icon">
		<link
			href="manifest.json"
			rel="manifest"
		>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link
			href="https://fonts.googleapis.com/css2?family=Caacupe+One&display=swap"
			rel="stylesheet">
		<meta charset="UTF-8">
		<meta
			content="LightSkyBlue"
			name="theme-color"
		>
		<meta
			content="initial-scale=1,interactive-widget=resizes-content,maximum-scale=1,user-scalable=no,width=device-width"
			name="viewport"
		>
		<title>&#127758;</title>
		<style>
		body {
			margin: 0;
			overflow: hidden;
			background: #87CEEB;
			font-family: 'Caacupe One', sans-serif;
			font-size: 6vmin;
			touch-action: none;
		}

		canvas {
			display: block;
		}

		.btn {
			width: 60px;
			height: 60px;
			background: rgba(255,255,255,0.3);
			border: 2px solid white;
			border-radius: 50%;
			color: white;
			font-weight: bold;
			display: flex;
			align-items: center;
			justify-content: center;
			user-select: none;
			cursor: pointer;
		}

		.joystick-container {
			position: absolute;
			bottom: 40px;
			width: 120px;
			height: 120px;
			background: rgba(255,255,255,0.2);
			border-radius: 50%;
			touch-action: none;
			border: 2px solid rgba(255,255,255,0.3);
			display: none;
		}

		.knob {
			position: absolute;
			top: 35px;
			left: 35px;
			width: 50px;
			height: 50px;
			background: rgba(255,255,255,0.5);
			border-radius: 50%;
			pointer-events: none;
		}

		#compass {
			font-size: 200%;
			font-weight: bold;
			letter-spacing: 2px;
		}

		#game-clock {
			display: none;
		}

		#height-controls {
			position: absolute;
			right: 40px;
			bottom: 180px;
			display: none;
			flex-direction: column;
			gap: 10px;
		}

		#hud-stats {
			position: absolute;
			top: 1rem;
			left: 50%;
			transform: translateX(-50%);
			color: white;
			text-shadow: 1px 1px 2px black;
			pointer-events: none;
			text-align: center;
		}

		#look-joy {
			right: 40px;
		}

		#move-joy {
			left: 40px;
		}
		</style>
	</head>
	<body id="main-body">
		<div id="hud-stats">
			<div id="compass">N</div>
			<div id="game-clock">00:00</div>
			<div id="altimeter">0m</div>
		</div>

		<div id="move-joy" class="joystick-container">
			<div class="knob" id="move-knob"></div>
		</div>
		<div id="look-joy" class="joystick-container">
			<div class="knob" id="look-knob"></div>
		</div>
		<div id="height-controls">
			<div class="btn" id="btn-jump">Jump</div>
		</div>

		<script
			src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>

		<script>
		const CYCLE_DURATION = 5 * 60000
		const scene = new THREE.Scene()

		const vertexShader = `
			varying vec3 vWorldPosition;
			void main() {
				vec4 worldPosition = modelMatrix * vec4(position, 1.0);
				vWorldPosition = worldPosition.xyz;
				gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
			}
		`
		const fragmentShader = `
			varying vec3 vWorldPosition;
			uniform vec3 uSkyColor;
			uniform vec3 uHorizonColor;
			void main() {
				float h = normalize(vWorldPosition).y;
				gl_FragColor = vec4(mix(uHorizonColor, uSkyColor, max(h, 0.0)), 1.0);
			}
		`
		const skyGeo = new THREE.SphereGeometry(500, 32, 15)
		const skyMat = new THREE.ShaderMaterial({
			uniforms: {
				uSkyColor: { value: new THREE.Color(0x84c7e9) },
				uHorizonColor: { value: new THREE.Color(0x87ceeb) },
			},
			vertexShader,
			fragmentShader,
			side: THREE.BackSide,
		})
		const sky = new THREE.Mesh(skyGeo, skyMat)
		scene.add(sky)

		const starGeo = new THREE.BufferGeometry()
		const starCount = 100
		const starPositions = new Float32Array(starCount * 3)
		for (let i = 0; i < starCount; i++) {
			const theta = Math.random() * Math.PI * 2
			const phi = Math.acos((Math.random() * 2) - 1)
			const radius = 480
			starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta)
			starPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta)
			starPositions[i * 3 + 2] = radius * Math.cos(phi)
		}
		starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3))

		const starMat = new THREE.ShaderMaterial({
			uniforms: {
				uOpacity: { value: 0 },
			},
			vertexShader: `
				varying float vY;
				void main() {
					vY = position.y;
					gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
					gl_PointSize = 2.0;
				}
			`,
			fragmentShader: `
				varying float vY;
				uniform float uOpacity;
				void main() {
					if (vY < 0.0) discard;
					gl_FragColor = vec4(1.0, 1.0, 1.0, uOpacity);
				}
			`,
			transparent: true,
			depthWrite: false,
		})
		const stars = new THREE.Points(starGeo, starMat)
		stars.material.fog = false
		scene.add(stars)

		// SUN SYSTEM
		const sunCanvas = document.createElement('canvas')
		sunCanvas.width = 256
		sunCanvas.height = 256
		const sctx = sunCanvas.getContext('2d')
		sctx.fillStyle = '#FFFFAA'
		sctx.beginPath()
		sctx.arc(128, 128, 100, 0, Math.PI * 2)
		sctx.fill()

		const sunTexture = new THREE.CanvasTexture(sunCanvas)
		const sunMat = new THREE.SpriteMaterial({
			map: sunTexture,
			transparent: true,
			depthTest: true,
		})
		const sun = new THREE.Sprite(sunMat)
		sun.material.fog = false
		sun.scale.set(48, 48, 1)
		scene.add(sun)

		const glowCanvas = document.createElement('canvas')
		glowCanvas.width = 64
		glowCanvas.height = 64
		const gctx = glowCanvas.getContext('2d')
		const gradient = gctx.createRadialGradient(32, 32, 0, 32, 32, 32)
		gradient.addColorStop(0, 'rgba(255, 255, 200, 1)')
		gradient.addColorStop(0.2, 'rgba(255, 255, 150, 0.5)')
		gradient.addColorStop(0.5, 'rgba(255, 200, 100, 0.1)')
		gradient.addColorStop(1, 'rgba(255, 200, 100, 0)')
		gctx.fillStyle = gradient
		gctx.fillRect(0, 0, 64, 64)

		const glowTexture = new THREE.CanvasTexture(glowCanvas)
		const glowMat = new THREE.SpriteMaterial({
			map: glowTexture,
			color: 0xfff5aa,
			transparent: true,
		})
		const sunGlow = new THREE.Sprite(glowMat)
		sunGlow.material.fog = false
		sunGlow.scale.set(150, 150, 1)
		scene.add(sunGlow)

		// MOON SYSTEM
		const moonCanvas = document.createElement('canvas')
		moonCanvas.width = 256
		moonCanvas.height = 256
		const mctx = moonCanvas.getContext('2d')
		mctx.translate(moonCanvas.width / 2, moonCanvas.height / 2)
		mctx.rotate(Math.PI / -4)
		mctx.fillStyle = '#ffffdd'
		mctx.beginPath()
		mctx.arc(0, 0, 100, 0, Math.PI * 2)
		mctx.fill()
		mctx.globalCompositeOperation = 'destination-out'
		mctx.beginPath()
		mctx.arc(50, 0, 100, 0, Math.PI * 2)
		mctx.fill()

		const moonTexture = new THREE.CanvasTexture(moonCanvas)
		const moonMat = new THREE.SpriteMaterial({
			map: moonTexture,
			transparent: true,
			opacity: 0,
			depthTest: true,
		})
		const moonCrescent = new THREE.Sprite(moonMat)
		moonCrescent.scale.set(50, 50, 1)
		const moonDist = 300
		moonCrescent.position.set(
			-moonDist * 0.707,
			moonDist * 0.707,
			-moonDist * 0.707,
		)
		moonCrescent.material.fog = false
		scene.add(moonCrescent)

		const moonLight = new THREE.DirectionalLight(0xccccff, 3)
		moonLight.position.copy(moonCrescent.position)
		scene.add(moonLight)

		const camera = new THREE.PerspectiveCamera(
			75,
			window.innerWidth / window.innerHeight,
			0.1,
			2000,
		)
		const renderer = new THREE.WebGLRenderer({ antialias: false })
		renderer.setSize(window.innerWidth, window.innerHeight)
		renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
		renderer.localClippingEnabled = true
		document.body.appendChild(renderer.domElement)

		scene.fog = new THREE.FogExp2(0x87CEEB, 0.01)
		renderer.setClearColor(0x87CEEB)

		const ambientLight = new THREE.AmbientLight(0xffffff, 2.0)
		scene.add(ambientLight)
		const directionalLight = new THREE.DirectionalLight(0xffffff, 2.0)
		scene.add(directionalLight)

		const diveLight = new THREE.SpotLight(0xffffff, 20)
		diveLight.distance = 60
		diveLight.angle = Math.PI / 2.5
		diveLight.penumbra = 0.2
		diveLight.decay = 1
		scene.add(diveLight)
		scene.add(diveLight.target)

		const cloudMaterial = new THREE.MeshBasicMaterial({
			color: 0xeeeeff,
			transparent: true,
			opacity: 0.97,
			depthWrite: true,
		})

		const cloudGroup = new THREE.Group()
		scene.add(cloudGroup)

		const CLOUD_CHUNK_SIZE = 128
		const cloudChunks = new Map()
		let windOffset = 0
		const WIND_SPEED = 0.277

		function createCloudCluster(x, z, y) {
			const cluster = new THREE.Group()
			const puffCount = Math.floor(Math.random() * 20)
			for (let j = 0; j < puffCount; j++) {
				const size = 10 + Math.random() * 20
				const puffGeo = new THREE.SphereGeometry(size, 6, 6)
				const puff = new THREE.Mesh(puffGeo, cloudMaterial)
				puff.material.fog = true
				puff.position.set(
					(Math.random() - 0.5) * 40,
					(Math.random() - 0.5) * 20,
					(Math.random() - 0.5) * 40,
				)
				puff.scale.set(
					0.7 + Math.random() * 1.3,
					0.5 + Math.random() * 1.0,
					0.7 + Math.random() * 1.3,
				)
				cluster.add(puff)
			}
			cluster.position.set(x, y, z)
			return cluster
		}

		function updateClouds() {
			windOffset += WIND_SPEED * 0.016
			const px = Math.floor((camera.position.x + windOffset) / CLOUD_CHUNK_SIZE)
			const pz = Math.floor(camera.position.z / CLOUD_CHUNK_SIZE)

			for (let x = px - 3; x <= px + 3; x++) {
				for (let z = pz - 3; z <= pz + 3; z++) {
					const key = `${x},${z}`
					if (!cloudChunks.has(key)) {
						const chunk = new THREE.Group()
						const seed = Math.sin(x * 12.9898 + z * 78.233) * 43758.5453
						const cloudCount = Math.floor(Math.abs(seed) % 5)
						for (let i = 0; i < cloudCount; i++) {
							chunk.add(
								createCloudCluster(
									(Math.random() - 0.5) * CLOUD_CHUNK_SIZE,
									(Math.random() - 0.5) * CLOUD_CHUNK_SIZE,
									60 + Math.random() * 60,
								),
							)
						}
						chunk.position.set(x * CLOUD_CHUNK_SIZE, 0, z * CLOUD_CHUNK_SIZE)
						cloudChunks.set(key, chunk)
						cloudGroup.add(chunk)
					}
				}
			}

			for (const [key, chunk] of cloudChunks.entries()) {
				const [cx, cz] = key.split(',').map(Number)
				if (Math.abs(cx - px) > 4 || Math.abs(cz - pz) > 4) {
					cloudGroup.remove(chunk)
					chunk.traverse((c) => {
						if (c.geometry) c.geometry.dispose()
					})
					cloudChunks.delete(key)
				}
			}
			cloudGroup.position.x = -windOffset
		}

		const renderTarget = new THREE.WebGLRenderTarget(
			window.innerWidth,
			window.innerHeight,
		)
		const postScene = new THREE.Scene()
		const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1)
		const postQuad = new THREE.PlaneGeometry(2, 2)

		const underwaterMaterial = new THREE.ShaderMaterial({
			uniforms: {
				tDiffuse: { value: null },
				uTime: { value: 0 },
				uUnderwater: { value: 0 },
			},
			vertexShader: `
				varying vec2 vUv;
				void main() {
					vUv = uv;
					gl_Position = vec4(position, 1.0);
				}
			`,
			fragmentShader: `
				uniform sampler2D tDiffuse;
				uniform float uTime;
				uniform float uUnderwater;
				varying vec2 vUv;
				void main() {
					vec2 uv = vUv;
					if (uUnderwater > 0.5) {
						float ripple = sin(uv.y * 20.0 + uTime * 2.0) * 0.005;
						ripple += cos(uv.x * 15.0 + uTime * 1.5) * 0.003;
						uv += ripple;
						vec4 color = texture2D(tDiffuse, uv);
						vec3 tint = vec3(0.2, 0.5, 0.8);
						color.rgb = mix(color.rgb, tint, 0.4);
						gl_FragColor = color;
					} else {
						gl_FragColor = texture2D(tDiffuse, uv);
					}
				}
			`,
		})
		const postMesh = new THREE.Mesh(postQuad, underwaterMaterial)
		postScene.add(postMesh)

		let yaw = 0, pitch = 0
		document.addEventListener('mousemove', (e) => {
			if (document.pointerLockElement === document.body) {
				yaw -= e.movementX * 0.002
				pitch -= e.movementY * 0.002
				pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch))
				camera.rotation.set(pitch, yaw, 0, 'YXZ')
			}
		})

		document.addEventListener('click', (e) => {
			if (e.target.classList.contains('btn')) return
			document.body.requestPointerLock()
		})

		function simplexNoise(x, z, seed) {
			return (
				Math.sin(x * 0.05 + seed) * Math.cos(z * 0.05 + seed) * -10 +
				Math.sin(x * 0.2 + seed * 1.1) * Math.cos(z * 0.2 + seed * 1.2) * -5 +
				Math.sin(x * 0.01 + seed * 0.5) * Math.sin(z * 0.01 + seed * 0.8) * 30 +
				Math.cos(x * 0.1 + z * 0.01 + seed) * -8
			)
		}

		const CHUNK_SIZE = 64, CHUNK_RES = 32, RENDER_DISTANCE = 3
		const chunks = new Map()
		const seedOffset = Math.random() * 1000
		const colorSnow = new THREE.Color(0xeeeeff),
			colorGrass = new THREE.Color(0x5db03a),
			colorSand = new THREE.Color(0xf0d0b0),
			colorClay = new THREE.Color(0x9a5a2a),
			colorRock = new THREE.Color(0x4b2d18)

		const terrainClippingPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 1)

		const trunkMat = new THREE.MeshToonMaterial({ color: 0x8B4513 })
		const leafMat = new THREE.MeshToonMaterial({ color: 0x228B22 })
		const boulderMat = new THREE.MeshLambertMaterial({
			color: 0xaaaaaa,
			clippingPlanes: [terrainClippingPlane],
		})

		function getTerrainHeight(x, z) {
			const rawHeight = simplexNoise(x, z, seedOffset)
			return rawHeight < 0.0
				? -Math.pow(Math.abs(rawHeight), 0.9) * 2.0 - 10.0
				: rawHeight * 0.8 - 10
		}

		function createTree(x, y, z) {
			const group = new THREE.Group()
			const trunk = new THREE.Mesh(
				new THREE.CylinderGeometry(0.2, 0.4, 6, 3),
				trunkMat,
			)
			trunk.position.y = 2.5
			const leaf = new THREE.Mesh(new THREE.ConeGeometry(2, 7, 3), leafMat)
			leaf.scale.set(1.2, 0.8, 1.2)
			leaf.position.set(0, 6, 0)
			group.add(trunk, leaf)
			group.position.set(x, y, z)
			return group
		}

		function createBoulder(x, y, z) {
			const boulder = new THREE.Mesh(
				new THREE.SphereGeometry(Math.max(0.3, 2 * Math.random()), 6, 3),
				boulderMat,
			)
			boulder.position.set(x, y + 0.15, z)
			boulder.scale.set(1, 0.7, 1)
			return boulder
		}

		function createChunk(cx, cz) {
			const geo = new THREE.PlaneGeometry(
				CHUNK_SIZE,
				CHUNK_SIZE,
				CHUNK_RES,
				CHUNK_RES,
			)
			geo.rotateX(-Math.PI / 2)
			const vertices = geo.attributes.position.array
			const colors = []
			const chunkGroup = new THREE.Group()

			for (let i = 0; i < vertices.length; i += 3) {
				const worldX = vertices[i] + cx * CHUNK_SIZE
				const worldZ = vertices[i + 2] + cz * CHUNK_SIZE
				const height = getTerrainHeight(worldX, worldZ)
				vertices[i + 1] = height

				const c = new THREE.Color()
				if (height > 20) {
					c.lerpColors(colorGrass, colorSnow, THREE.MathUtils.clamp(height, 0, 1))
				} else if (height > 0) {
					c.lerpColors(
						colorSand,
						colorGrass,
						THREE.MathUtils.clamp(height / 3, 0, 1),
					)
				} else if (height > -10) {
					c.lerpColors(
						colorClay,
						colorSand,
						THREE.MathUtils.clamp((height + 10) / 10, 0, 1),
					)
				} else {c.lerpColors(
						colorRock,
						colorClay,
						THREE.MathUtils.clamp((height + 20) / 10, 0, 1),
					)}
				colors.push(c.r, c.g, c.b)

				if (Math.random() < 0.1 && height < 15) {
					if (height > 3 || (height > -1 && Math.random() < 0.01)) {
						chunkGroup.add(createTree(worldX, height, worldZ))
					}
				}
				if (Math.random() < 0.01 && height > -20) {
					chunkGroup.add(createBoulder(worldX, height, worldZ))
				}
			}
			geo.computeVertexNormals()
			geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3))
			const mesh = new THREE.Mesh(
				geo,
				new THREE.MeshLambertMaterial({
					vertexColors: true,
					clippingPlanes: [terrainClippingPlane],
				}),
			)
			mesh.position.set(cx * CHUNK_SIZE, 0, cz * CHUNK_SIZE)
			const container = new THREE.Group()
			container.add(mesh, chunkGroup)
			scene.add(container)
			return container
		}

		function updateChunks() {
			const px = Math.floor(camera.position.x / CHUNK_SIZE)
			const pz = Math.floor(camera.position.z / CHUNK_SIZE)
			for (let x = px - RENDER_DISTANCE; x <= px + RENDER_DISTANCE; x++) {
				for (let z = pz - RENDER_DISTANCE; z <= pz + RENDER_DISTANCE; z++) {
					const key = `${x},${z}`
					if (!chunks.has(key)) chunks.set(key, createChunk(x, z))
				}
			}
			for (const [key, group] of chunks.entries()) {
				const [cx, cz] = key.split(',').map(Number)
				if (
					Math.abs(cx - px) > RENDER_DISTANCE + 1 ||
					Math.abs(cz - pz) > RENDER_DISTANCE + 1
				) {
					scene.remove(group)
					group.traverse((child) => {
						if (child.geometry) child.geometry.dispose()
						if (child.material) child.material.dispose()
					})
					chunks.delete(key)
				}
			}
		}

		// Find spawn position on land
		let spawnX = 0, spawnZ = 0
		while (true) {
			spawnX = (Math.random() - 0.5) * 100
			spawnZ = (Math.random() - 0.5) * 100
			if (getTerrainHeight(spawnX, spawnZ) > 0) break
		}
		camera.position.set(spawnX, 10, spawnZ)

		const oceanGeo = new THREE.PlaneGeometry(1000, 1000, 768, 768)
		oceanGeo.rotateX(-Math.PI / 2)
		const oceanMat = new THREE.ShaderMaterial({
			uniforms: {
				uTime: { value: 0 },
				uFogColor: { value: new THREE.Color(0x87ceeb) },
				uFogDensity: { value: 0.02 },
				uSeed: { value: seedOffset },
			},
			vertexShader: `
				uniform float uTime;
				uniform float uSeed;
				varying float vHeight;
				varying vec3 vWorldPosition;
				varying float vDepth;
				float getTerrainHeight(float x, float z) {
					float seed = uSeed;
					float rawHeight = (sin(x * 0.05 + seed) * cos(z * 0.05 + seed) * -10.0 + sin(x * 0.2 + seed * 1.1) * cos(z * 0.2 + seed * 1.2) * -5.0 + sin(x * 0.01 + seed * 0.5) * sin(z * 0.01 + seed * 0.8) * 30.0 + cos(x * 0.1 + z * 0.01 + seed) * -8.0);
					return rawHeight < 0.0 ? -pow(abs(rawHeight), 0.9) * 2.0 - 10.0 : rawHeight * 0.8 - 10.0;
				}
				void main() {
					vec3 pos = position;
					float h = sin(pos.x * 0.05 + uTime) * 0.4 + cos(pos.z * 0.07 + uTime * 1.2) * 0.4;
					pos.y += h;
					vHeight = h;
					vec4 worldPos = modelMatrix * vec4(pos, 1.0);
					vWorldPosition = worldPos.xyz;
					vDepth = vWorldPosition.y - getTerrainHeight(vWorldPosition.x, vWorldPosition.z);
					gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
				}
			`,
			fragmentShader: `
				uniform vec3 uFogColor;
				uniform float uFogDensity;
				varying float vHeight;
				varying vec3 vWorldPosition;
				varying float vDepth;
				void main() {

				const centerX = rect.left + rect.width / 2,
					centerY = rect.top + rect.height / 2

					dy *= maxRadius / distance

				callback(dx / maxRadius, dy / maxRadius)

				e.preventDefault()
				activeTouchId = e.changedTouches[0].identifier
				handleTouch(e)

					rainPositions[i * 3 + 1] = RAIN_BOUNDS
					rainPositions[i * 3] = (Math.random() - 0.5) * RAIN_BOUNDS * 2
					rainPositions[i * 3 + 2] = (Math.random() - 0.5) * RAIN_BOUNDS * 2
				}
			}
			rainGeo.attributes.position.needsUpdate = true
			rain.position.copy(camera.position)

			updateChunks()
			updateClouds()
			updateBirds(delta, time)
			updateFish(delta, time)
			updateHUD(time)
			if (audioStarted) {
				audioEl.volume = Math.max(0, Math.min(1, 1 - (camera.position.y / 100)))
				lowPassFilter.frequency.setTargetAtTime(
					camera.position.y < -1 ? 400 : 22000,
					audioCtx.currentTime,
					0.1,
				)
			}

			renderer.setRenderTarget(renderTarget)
			renderer.render(scene, camera)
			renderer.setRenderTarget(null)
			underwaterMaterial.uniforms.tDiffuse.value = renderTarget.texture
			renderer.render(postScene, postCamera)
			prevTime = now
		}
		animateFixed()

		window.addEventListener('resize', () => {
			camera.aspect = window.innerWidth / window.innerHeight
			camera.updateProjectionMatrix()
			renderer.setSize(window.innerWidth, window.innerHeight)
			renderTarget.setSize(window.innerWidth, window.innerHeight)
		})

		window.addEventListener('pointerlockchange', () => {
			const isLocked = document.pointerLockElement === document.body
			const isTouch = 'ontouchstart' in window
			;['move-joy', 'look-joy', 'height-controls'].forEach((id) => {
				document.getElementById(id).style.display = (isLocked || !isTouch)
					? 'none'
					: (id === 'height-controls' ? 'flex' : 'block')
			})
		})

		if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
			document.getElementById('move-joy').style.display = 'block'
			document.getElementById('look-joy').style.display = 'block'
			document.getElementById('height-controls').style.display = 'flex'
		}
		navigator.serviceWorker.register('work.js')
		</script>
	</body>
</html>
