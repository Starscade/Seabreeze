<!DOCTYPE html>
<html lang="en">
	<head>
		<link
			href="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="
			rel="icon">
		<title>&#127758;</title>
		<style>
		body {
			margin: 0;
			overflow: hidden;
			background: #87CEEB;
			font-family: sans-serif;
			touch-action: none;
		}
		canvas {
			display: block;
		}
		#ui {
			position: absolute;
			top: 10px;
			left: 10px;
			color: white;
			text-shadow: 1px 1px 2px black;
			pointer-events: none;
			font-size: 14px;
		}
		#hud-stats {
			position: absolute;
			top: 10px;
			left: 50%;
			transform: translateX(-50%);
			color: white;
			text-shadow: 1px 1px 2px black;
			pointer-events: none;
			text-align: center;
			font-family: 'Courier New', Courier, monospace;
		}
		#compass {
			font-weight: bold;
			font-size: 18px;
			letter-spacing: 2px;
			margin-bottom: 5px;
		}
		#altimeter {
			font-size: 14px;
			opacity: 0.9;
		}
		#game-clock {
			font-size: 14px;
			opacity: 0.9;
		}
		.joystick-container {
			position: absolute;
			bottom: 40px;
			width: 120px;
			height: 120px;
			background: rgba(255,255,255,0.2);
			border-radius: 50%;
			touch-action: none;
			border: 2px solid rgba(255,255,255,0.3);
		}
		#move-joy {
			left: 40px;
		}
		#look-joy {
			right: 40px;
		}
		.knob {
			position: absolute;
			top: 35px;
			left: 35px;
			width: 50px;
			height: 50px;
			background: rgba(255,255,255,0.5);
			border-radius: 50%;
			pointer-events: none;
		}
		#height-controls {
			position: absolute;
			right: 40px;
			bottom: 180px;
			display: flex;
			flex-direction: column;
			gap: 10px;
		}
		.btn {
			width: 60px;
			height: 60px;
			background: rgba(255,255,255,0.3);
			border: 2px solid white;
			border-radius: 50%;
			color: white;
			font-weight: bold;
			display: flex;
			align-items: center;
			justify-content: center;
			user-select: none;
			cursor: pointer;
		}
		#fs-btn {
			position: absolute;
			top: 10px;
			right: 10px;
			width: 50px;
			height: 50px;
			border-radius: 8px;
		}
		</style>
	</head>
	<body id="main-body">
		<div
			id="ui">WASD/Joy: Move | Q/E: Up/Down | Shift: Sprint | Click to Lock Mouse</div>

		<div id="hud-stats">
			<div id="compass">N</div>
			<div id="altimeter">ALT: 0m</div>
			<div id="game-clock">00:00</div>
		</div>

		<div id="fs-btn" class="btn">FULL</div>

		<div id="move-joy" class="joystick-container">
			<div class="knob" id="move-knob"></div>
		</div>
		<div id="look-joy" class="joystick-container">
			<div class="knob" id="look-knob"></div>
		</div>
		<div id="height-controls">
			<div class="btn" id="btn-up">UP</div>
			<div class="btn" id="btn-down">DN</div>
		</div>

		<script
			src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>

		<script>
		const CYCLE_DURATION = 60000
		const scene = new THREE.Scene()

		const vertexShader = `
			varying vec3 vWorldPosition;
			void main() {
				vec4 worldPosition = modelMatrix * vec4(position, 1.0);
				vWorldPosition = worldPosition.xyz;
				gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
			}
		`
		const fragmentShader = `
			varying vec3 vWorldPosition;
			uniform vec3 uSkyColor;
			uniform vec3 uHorizonColor;
			void main() {
				float h = normalize(vWorldPosition).y;
				gl_FragColor = vec4(mix(uHorizonColor, uSkyColor, max(h, 0.0)), 1.0);
			}
		`
		const skyGeo = new THREE.SphereGeometry(500, 32, 15)
		const skyMat = new THREE.ShaderMaterial({
			uniforms: {
				uSkyColor: { value: new THREE.Color(0x84c7e9) },
				uHorizonColor: { value: new THREE.Color(0xb1d9ff) },
			},
			vertexShader,
			fragmentShader,
			side: THREE.BackSide,
		})
		const sky = new THREE.Mesh(skyGeo, skyMat)
		scene.add(sky)

		const starGeo = new THREE.BufferGeometry()
		const starCount = 100
		const starPositions = new Float32Array(starCount * 3)
		for (let i = 0; i < starCount; i++) {
			const theta = Math.random() * Math.PI * 2
			const phi = Math.acos((Math.random() * 2) - 1)
			const radius = 480
			starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta)
			starPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta)
			starPositions[i * 3 + 2] = radius * Math.cos(phi)
		}
		starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3))

		const starMat = new THREE.ShaderMaterial({
			uniforms: {
				uOpacity: { value: 0 },
			},
			vertexShader: `
				varying float vY;
				void main() {
					vY = position.y;
					gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
					gl_PointSize = 2.0;
				}
			`,
			fragmentShader: `
				varying float vY;
				uniform float uOpacity;
				void main() {
					if (vY < 0.0) discard;
					gl_FragColor = vec4(1.0, 1.0, 1.0, uOpacity);
				}
			`,
			transparent: true,
			depthWrite: false,
		})
		const stars = new THREE.Points(starGeo, starMat)
		stars.material.fog = false
		scene.add(stars)

		const sunGeo = new THREE.SphereGeometry(24, 16, 16)
		const sunMat = new THREE.MeshBasicMaterial({
			color: 0xFFFFAA,
			depthTest: false,
		})
		const sun = new THREE.Mesh(sunGeo, sunMat)
		sun.material.fog = false
		scene.add(sun)

		const camera = new THREE.PerspectiveCamera(
			75,
			window.innerWidth / window.innerHeight,
			0.1,
			2000,
		)
		const renderer = new THREE.WebGLRenderer()
		renderer.setSize(window.innerWidth, window.innerHeight)
		renderer.setPixelRatio(window.devicePixelRatio)
		renderer.localClippingEnabled = true
		document.body.appendChild(renderer.domElement)

		scene.fog = new THREE.FogExp2(0x87CEEB, 0.01)
		renderer.setClearColor(0x87CEEB)

		const ambientLight = new THREE.AmbientLight(0xffffff, 2.0)
		scene.add(ambientLight)
		const directionalLight = new THREE.DirectionalLight(0xffffff, 2.0)
		scene.add(directionalLight)

		const diveLight = new THREE.SpotLight(0xffffff, 20)
		diveLight.distance = 30
		diveLight.angle = Math.PI / 2.5
		diveLight.penumbra = 0.2
		diveLight.decay = 1
		diveLight.visible = true
		scene.add(diveLight)
		scene.add(diveLight.target)

		const cloudMaterial = new THREE.MeshLambertMaterial({
			color: 0xffffff,
			transparent: false,
			depthWrite: true,
		})

		const cloudGroup = new THREE.Group()
		scene.add(cloudGroup)

		const CLOUD_CHUNK_SIZE = 128
		const cloudChunks = new Map()
		let windOffset = 0
		const WIND_SPEED = 0.277

		function createCloudCluster(x, z, y) {
			const cluster = new THREE.Group()
			const puffCount = 5 + Math.floor(Math.random() * 10)
			for (let j = 0; j < puffCount; j++) {
				const size = 10 + Math.random() * 20
				const puffGeo = new THREE.SphereGeometry(size, 8, 8)
				const puff = new THREE.Mesh(puffGeo, cloudMaterial)
				puff.material.fog = false
				puff.position.set(
					(Math.random() - 0.5) * 40,
					(Math.random() - 0.5) * 20,
					(Math.random() - 0.5) * 40,
				)
				puff.scale.set(
					0.7 + Math.random() * 1.3,
					0.5 + Math.random() * 1.0,
					0.7 + Math.random() * 1.3,
				)
				cluster.add(puff)
			}
			cluster.position.set(x, y, z)
			return cluster
		}

		function updateClouds() {
			windOffset += WIND_SPEED * 0.016
			const px = Math.floor((camera.position.x + windOffset) / CLOUD_CHUNK_SIZE)
			const pz = Math.floor(camera.position.z / CLOUD_CHUNK_SIZE)

			for (let x = px - 3; x <= px + 3; x++) {
				for (let z = pz - 3; z <= pz + 3; z++) {
					const key = `${x},${z}`
					if (!cloudChunks.has(key)) {
						const chunk = new THREE.Group()
						const seed = Math.sin(x * 12.9898 + z * 78.233) * 43758.5453
						const cloudCount = Math.floor(Math.abs(seed) % 5)
						for (let i = 0; i < cloudCount; i++) {
							const cx = (Math.random() - 0.5) * CLOUD_CHUNK_SIZE
							const cz = (Math.random() - 0.5) * CLOUD_CHUNK_SIZE
							const cy = 60 + Math.random() * 60
							chunk.add(createCloudCluster(cx, cz, cy))
						}
						chunk.position.set(x * CLOUD_CHUNK_SIZE, 0, z * CLOUD_CHUNK_SIZE)
						cloudChunks.set(key, chunk)
						cloudGroup.add(chunk)
					}
				}
			}

			for (const [key, chunk] of cloudChunks.entries()) {
				const [cx, cz] = key.split(',').map(Number)
				if (Math.abs(cx - px) > 4 || Math.abs(cz - pz) > 4) {
					cloudGroup.remove(chunk)
					chunk.traverse((c) => {
						if (c.geometry) c.geometry.dispose()
					})
					cloudChunks.delete(key)
				}
			}
			cloudGroup.position.x = -windOffset
		}

		const renderTarget = new THREE.WebGLRenderTarget(
			window.innerWidth,
			window.innerHeight,
		)
		const postScene = new THREE.Scene()
		const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1)
		const postQuad = new THREE.PlaneGeometry(2, 2)

		const underwaterMaterial = new THREE.ShaderMaterial({
			uniforms: {
				tDiffuse: { value: null },
				uTime: { value: 0 },
				uUnderwater: { value: 0 },
			},
			vertexShader: `
				varying vec2 vUv;
				void main() {
					vUv = uv;
					gl_Position = vec4(position, 1.0);
				}
			`,
			fragmentShader: `
				uniform sampler2D tDiffuse;
				uniform float uTime;
				uniform float uUnderwater;
				varying vec2 vUv;
				void main() {
					vec2 uv = vUv;
					if (uUnderwater > 0.5) {
						float ripple = sin(uv.y * 20.0 + uTime * 2.0) * 0.005;
						ripple += cos(uv.x * 15.0 + uTime * 1.5) * 0.003;
						uv += ripple;
						vec4 color = texture2D(tDiffuse, uv);
						vec3 tint = vec3(0.2, 0.5, 0.8);
						color.rgb = mix(color.rgb, tint, 0.4);
						gl_FragColor = color;
					} else {
						gl_FragColor = texture2D(tDiffuse, uv);
					}
				}
			`,
		})
		const postMesh = new THREE.Mesh(postQuad, underwaterMaterial)
		postScene.add(postMesh)

		let yaw = 0, pitch = 0
		document.addEventListener('mousemove', (e) => {
			if (document.pointerLockElement === document.body) {
				yaw -= e.movementX * 0.002
				pitch -= e.movementY * 0.002
				pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch))
				camera.rotation.set(pitch, yaw, 0, 'YXZ')
			}
		})

		document.addEventListener('click', (e) => {
			if (e.target.classList.contains('btn')) return
			document.body.requestPointerLock()
		})

		function simplexNoise(x, z, seed) {
			return (
				Math.sin(x * 0.05 + seed) * Math.cos(z * 0.05 + seed) * 10 +
				Math.sin(x * 0.2 + seed * 1.1) * Math.cos(z * 0.2 + seed * 1.2) * 5 +
				Math.sin(x * 0.01 + seed * 0.5) * Math.sin(z * 0.01 + seed * 0.8) * 20 +
				Math.cos(x * 0.1 + z * 0.1 + seed) * 8
			)
		}

		const CHUNK_SIZE = 64
		const CHUNK_RES = 32
		const RENDER_DISTANCE = 3
		const chunks = new Map()
		const seedOffset = Math.random() * 1000
		const colorGrass = new THREE.Color(0x5db03a)
		const colorSand = new THREE.Color(0xf0d0b0)
		const colorDirt = new THREE.Color(0x9a5a2a)

		const terrainClippingPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 1)

		const trunkMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 })
		const leafMat = new THREE.MeshLambertMaterial({ color: 0x228B22 })
		const bushMat = new THREE.MeshLambertMaterial({ color: 0x32CD32 })

		function createPalmTree(x, y, z) {
			const group = new THREE.Group()
			const trunkGeo = new THREE.CylinderGeometry(0.2, 0.4, 5, 8)
			const trunk = new THREE.Mesh(trunkGeo, trunkMat)
			trunk.position.y = 2.5
			group.add(trunk)

			for (let i = 0; i < 6; i++) {
				const leafGeo = new THREE.SphereGeometry(1.5, 8, 8)
				const leaf = new THREE.Mesh(leafGeo, leafMat)
				leaf.scale.set(1, 0.2, 0.5)
				leaf.position.set(
					Math.cos(i * Math.PI / 3) * 1,
					5,
					Math.sin(i * Math.PI / 3) * 1,
				)
				leaf.rotation.set(0.5, i * Math.PI / 3, 0)
				group.add(leaf)
			}
			group.position.set(x, y, z)
			return group
		}

		function createBush(x, y, z) {
			const bushGeo = new THREE.SphereGeometry(0.8, 6, 6)
			const bush = new THREE.Mesh(bushGeo, bushMat)
			bush.position.set(x, y + 0.4, z)
			bush.scale.set(1, 0.7, 1)
			return bush
		}

		function createChunk(cx, cz) {
			const geo = new THREE.PlaneGeometry(
				CHUNK_SIZE,
				CHUNK_SIZE,
				CHUNK_RES,
				CHUNK_RES,
			)
			geo.rotateX(-Math.PI / 2)
			const vertices = geo.attributes.position.array
			const colors = []
			const chunkGroup = new THREE.Group()

			for (let i = 0; i < vertices.length; i += 3) {
				const worldX = vertices[i] + cx * CHUNK_SIZE
				const worldZ = vertices[i + 2] + cz * CHUNK_SIZE
				let height = simplexNoise(worldX, worldZ, seedOffset) - 15
				vertices[i + 1] = height
				const c = new THREE.Color()
				if (height > 2) c.copy(colorGrass)
				else if (height > -1) c.copy(colorSand)
				else c.copy(colorDirt)
				colors.push(c.r, c.g, c.b)

				if (Math.random() < 0.02) {
					if (height > 1) {
						const palm = createPalmTree(worldX, height, worldZ)
						chunkGroup.add(palm)
					} else if (height > -1 && Math.random() < 0.3) {
						const palm = createPalmTree(worldX, height, worldZ)
						chunkGroup.add(palm)
					}
				}
				if (Math.random() < 0.05 && height > 1) {
					chunkGroup.add(createBush(worldX, height, worldZ))
				}
			}
			geo.computeVertexNormals()
			geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3))
			const mat = new THREE.MeshLambertMaterial({
				vertexColors: true,
				flatShading: true,
				side: THREE.DoubleSide,
				clippingPlanes: [terrainClippingPlane],
			})
			const mesh = new THREE.Mesh(geo, mat)
			mesh.position.set(cx * CHUNK_SIZE, 0, cz * CHUNK_SIZE)

			const container = new THREE.Group()
			container.add(mesh)
			container.add(chunkGroup)
			scene.add(container)
			return container
		}

		function updateChunks() {
			const px = Math.floor(camera.position.x / CHUNK_SIZE)
			const pz = Math.floor(camera.position.z / CHUNK_SIZE)
			for (let x = px - RENDER_DISTANCE; x <= px + RENDER_DISTANCE; x++) {
				for (let z = pz - RENDER_DISTANCE; z <= pz + RENDER_DISTANCE; z++) {
					const key = `${x},${z}`
					if (!chunks.has(key)) chunks.set(key, createChunk(x, z))
				}
			}
			for (const [key, group] of chunks.entries()) {
				const [cx, cz] = key.split(',').map(Number)
				if (
					Math.abs(cx - px) > RENDER_DISTANCE + 1 ||
					Math.abs(cz - pz) > RENDER_DISTANCE + 1
				) {
					scene.remove(group)
					group.traverse((child) => {
						if (child.geometry) child.geometry.dispose()
						if (child.material) child.material.dispose()
					})
					chunks.delete(key)
				}
			}
		}

		camera.position.set(0, 10, 0)
		const waterGeo = new THREE.PlaneGeometry(4000, 4000)
		const waterMat = new THREE.MeshLambertMaterial({
			color: 0x001a33,
			transparent: true,
			opacity: 0.8,
			side: THREE.DoubleSide,
		})
		const ocean = new THREE.Mesh(waterGeo, waterMat)
		ocean.rotation.x = -Math.PI / 2
		ocean.position.y = -1
		scene.add(ocean)

		let moveForward = false,
			moveBackward = false,
			moveLeft = false,
			moveRight = false,
			moveUp = false,
			moveDown = false,
			isSprinting = false
		let joyX = 0, joyY = 0, lookX = 0, lookY = 0
		let velocity = new THREE.Vector3()

		document.addEventListener('keydown', (e) => {
			if (e.code === 'KeyW') moveForward = true
			if (e.code === 'KeyS') moveBackward = true
			if (e.code === 'KeyA') moveLeft = true
			if (e.code === 'KeyD') moveRight = true
			if (e.code === 'KeyE') moveUp = true
			if (e.code === 'KeyQ') moveDown = true
			if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') isSprinting = true
		})
		document.addEventListener('keyup', (e) => {
			if (e.code === 'KeyW') moveForward = false
			if (e.code === 'KeyS') moveBackward = false
			if (e.code === 'KeyA') moveLeft = false
			if (e.code === 'KeyD') moveRight = false
			if (e.code === 'KeyE') moveUp = false
			if (e.code === 'KeyQ') moveDown = false
			if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') isSprinting = false
		})

		function setupJoystick(containerId, knobId, callback) {
			const container = document.getElementById(containerId)
			const knob = document.getElementById(knobId)
			let activeTouchId = null
			const handleTouch = (e) => {
				e.preventDefault()
				let touch = null
				for (let i = 0; i < e.touches.length; i++) {
					if (e.touches[i].identifier === activeTouchId) {
						touch = e.touches[i]
						break
					}
				}
				if (!touch) return
				const rect = container.getBoundingClientRect()
				const centerX = rect.left + rect.width / 2
				const centerY = rect.top + rect.height / 2
				let dx = touch.clientX - centerX
				let dy = touch.clientY - centerY
				const distance = Math.sqrt(dx * dx + dy * dy)
				const maxRadius = rect.width / 2
				if (distance > maxRadius) {
					dx *= maxRadius / distance
					dy *= maxRadius / distance
				}
				knob.style.transform = `translate(${dx}px, ${dy}px)`
				callback(dx / maxRadius, dy / maxRadius)
			}
			container.addEventListener('touchstart', (e) => {
				e.preventDefault()
				const touch = e.changedTouches[0]
				activeTouchId = touch.identifier
				handleTouch(e)
			})
			container.addEventListener('touchmove', (e) => {
				if (activeTouchId !== null) handleTouch(e)
			}, { passive: false })
			container.addEventListener('touchend', (e) => {
				for (let i = 0; i < e.changedTouches.length; i++) {
					if (e.changedTouches[i].identifier === activeTouchId) {
						activeTouchId = null
						knob.style.transform = `translate(0, 0)`
						callback(0, 0)
					}
				}
			})
		}

		setupJoystick('move-joy', 'move-knob', (x, y) => {
			joyX = x
			joyY = y
		})
		setupJoystick('look-joy', 'look-knob', (x, y) => {
			lookX = x
			lookY = y
		})

		document.getElementById('btn-up').addEventListener('touchstart', (e) => {
			e.preventDefault()
			moveUp = true
		})
		document.getElementById('btn-up').addEventListener(
			'touchend',
			() => moveUp = false,
		)
		document.getElementById('btn-down').addEventListener('touchstart', (e) => {
			e.preventDefault()
			moveDown = true
		})
		document.getElementById('btn-down').addEventListener(
			'touchend',
			() => moveDown = false,
		)

		document.getElementById('fs-btn').addEventListener('click', () => {
			if (!document.fullscreenElement) {
				document.documentElement.requestFullscreen().catch((e) => {})
			} else {
				document.exitFullscreen()
			}
		})

		const compassEl = document.getElementById('compass')
		const altEl = document.getElementById('altimeter')
		const clockEl = document.getElementById('game-clock')

		function updateHUD(time) {
			altEl.textContent = `ALT: ${Math.round(camera.position.y)}m`
			const degrees = (yaw * 180 / Math.PI) % 360
			const normalizedDeg = (360 - degrees) % 360

			let dir = 'N'
			if (normalizedDeg >= 337.5 || normalizedDeg < 22.5) dir = 'N'
			else if (normalizedDeg >= 22.5 && normalizedDeg < 67.5) dir = 'NE'
			else if (normalizedDeg >= 67.5 && normalizedDeg < 112.5) dir = 'E'
			else if (normalizedDeg >= 112.5 && normalizedDeg < 157.5) dir = 'SE'
			else if (normalizedDeg >= 157.5 && normalizedDeg < 202.5) dir = 'S'
			else if (normalizedDeg >= 202.5 && normalizedDeg < 247.5) dir = 'SW'
			else if (normalizedDeg >= 247.5 && normalizedDeg < 292.5) dir = 'W'
			else if (normalizedDeg >= 292.5 && normalizedDeg < 337.5) dir = 'NW'

			compassEl.textContent = dir

			const progress = (time % CYCLE_DURATION) / CYCLE_DURATION
			let hours = (progress * 24) + 6
			if (hours >= 24) hours -= 24

			const totalMinutes = Math.floor(hours * 60)
			const h = Math.floor(totalMinutes / 60)
			const m = totalMinutes % 60
			clockEl.textContent = `${h.toString().padStart(2, '0')}:${
				m.toString().padStart(2, '0')
			}`
		}

		let prevTime = performance.now()

		let startTimeOffset = Math.random() * CYCLE_DURATION
		const urlParams = new URLSearchParams(window.location.search)
		const timeParam = urlParams.get('time')
		if (timeParam && timeParam.length === 4) {
			const h = parseInt(timeParam.substring(0, 2), 10)
			const m = parseInt(timeParam.substring(2, 4), 10)
			if (!isNaN(h) && !isNaN(m)) {
				const totalMinutes = h * 60 + m
				const dayProgress = totalMinutes / (24 * 60)
				startTimeOffset = (dayProgress * CYCLE_DURATION) - (6 / 24 * CYCLE_DURATION)
				if (startTimeOffset < 0) startTimeOffset += CYCLE_DURATION
			}
		}

		let currentTime = prevTime + startTimeOffset

		const rainCount = 2000
		const rainGeo = new THREE.BufferGeometry()
		const rainPos = new Float32Array(rainCount * 3)
		const rainVel = new Float32Array(rainCount)
		for (let i = 0; i < rainCount; i++) {
			rainPos[i * 3] = (Math.random() - 0.5) * 100
			rainPos[i * 3 + 1] = Math.random() * 100
			rainPos[i * 3 + 2] = (Math.random() - 0.5) * 100
			rainVel[i] = 20 + Math.random() * 20
		}
		rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3))
		const rainMat = new THREE.PointsMaterial({
			color: 0xaaaaaa,
			size: 0.1,
			transparent: true,
			opacity: 0,
		})
		const rain = new THREE.Points(rainGeo, rainMat)
		scene.add(rain)

		let isRaining = false
		let rainTimer = Math.random() * CYCLE_DURATION

		function animateFixed() {
			requestAnimationFrame(animateFixed)
			const now = performance.now()
			const delta = (now - prevTime) / 1000

			const time = now + startTimeOffset
			const cycleProgress = (time % CYCLE_DURATION) / CYCLE_DURATION
			const angle = cycleProgress * Math.PI * 2

			const sunDist = 300
			const sunX = Math.cos(angle) * sunDist
			const sunY = Math.sin(angle) * sunDist
			const sunZ = -Math.sin(angle) * sunDist
			sun.position.copy(camera.position).add(new THREE.Vector3(sunX, sunY, sunZ))
			directionalLight.position.copy(sun.position)

			const sunHeight = Math.sin(angle)
			const dayIntensity = Math.max(0, sunHeight)

			ambientLight.intensity = 0.2 + dayIntensity * 1.8
			directionalLight.intensity = dayIntensity * 2.0

			const nightSky = new THREE.Color(0x0a0230)
			const nightHorizon = new THREE.Color(0x063768)
			const sunriseSky = new THREE.Color(0x4b306d)
			const sunriseHorizon = new THREE.Color(0xff7e5f)
			const daySky = new THREE.Color(0x84c7e9)
			const dayHorizon = new THREE.Color(0xb1d9ff)
			const sunsetSky = new THREE.Color(0x4b306d)
			const sunsetHorizon = new THREE.Color(0xfa8072)

			let currentSky = new THREE.Color()
			let currentHorizon = new THREE.Color()

			if (sunHeight > 0.2) {
				currentSky.lerpColors(sunriseSky, daySky, (sunHeight - 0.2) / 0.8)
				currentHorizon.lerpColors(
					sunriseHorizon,
					dayHorizon,
					(sunHeight - 0.2) / 0.8,
				)
			} else if (sunHeight > -0.2) {
				const t = (sunHeight + 0.2) / 0.4
				currentSky.lerpColors(nightSky, sunriseSky, t)
				currentHorizon.lerpColors(nightHorizon, sunriseHorizon, t)
			} else {
				currentSky.copy(nightSky)
				currentHorizon.copy(nightHorizon)
			}

			rainTimer -= delta
			if (rainTimer <= 0) {
				isRaining = !isRaining
				rainTimer = isRaining ? 15 + Math.random() * 30 : 30 + Math.random() * 100
			}

			if (isRaining) {
				rainMat.opacity = THREE.MathUtils.lerp(rainMat.opacity, 0.6, 0.01)
				currentSky.lerp(new THREE.Color(0x444444), 0.3)
				currentHorizon.lerp(new THREE.Color(0x444444), 0.3)
			} else {
				rainMat.opacity = THREE.MathUtils.lerp(rainMat.opacity, 0, 0.01)
			}

			skyMat.uniforms.uSkyColor.value.copy(currentSky)
			skyMat.uniforms.uHorizonColor.value.copy(currentHorizon)

			starMat.uniforms.uOpacity.value = Math.max(0, Math.min(1, -sunHeight))
			sun.visible = sunHeight > -0.1

			if (document.pointerLockElement !== document.body) {
				if (Math.abs(lookX) > 0.1 || Math.abs(lookY) > 0.1) {
					yaw -= lookX * 0.05
					pitch -= lookY * 0.05
					pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch))
					camera.rotation.set(pitch, yaw, 0, 'YXZ')
				}
			}

			const isUnderwater = camera.position.y < -1
			if (isUnderwater) {
				const underwaterDayColor = new THREE.Color(0x5b94b0)
				const underwaterNightColor = new THREE.Color(0x020a15)
				const currentUnderwaterColor = new THREE.Color().lerpColors(
					underwaterNightColor,
					underwaterDayColor,
					dayIntensity,
				)

				scene.fog = new THREE.FogExp2(currentUnderwaterColor, 0.1)
				renderer.setClearColor(currentUnderwaterColor)
				rain.visible = false
				sky.visible = false
				stars.visible = false
				diveLight.visible = true
				diveLight.position.copy(camera.position)
				const targetPos = new THREE.Vector3(0, 0, -1).applyQuaternion(
					camera.quaternion,
				).add(camera.position)
				diveLight.target.position.copy(targetPos)
				terrainClippingPlane.constant = 1000
				underwaterMaterial.uniforms.uUnderwater.value = 1.0
			} else {
				const fogColor = new THREE.Color().copy(currentSky)
				scene.fog = new THREE.FogExp2(fogColor, 0.01)
				renderer.setClearColor(fogColor)
				rain.visible = true
				sky.visible = true
				stars.visible = true
				diveLight.visible = true
				diveLight.position.copy(camera.position)
				const targetPos = new THREE.Vector3(0, 0, -1).applyQuaternion(
					camera.quaternion,
				).add(camera.position)
				diveLight.target.position.copy(targetPos)
				terrainClippingPlane.constant = -1
				underwaterMaterial.uniforms.uUnderwater.value = 0.0
			}

			underwaterMaterial.uniforms.uTime.value = time * 0.001

			velocity.x -= velocity.x * 10.0 * delta
			velocity.y -= velocity.y * 10.0 * delta
			velocity.z -= velocity.z * 10.0 * delta

			const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion)
			const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion)
			const up = new THREE.Vector3(0, 1, 0)

			const moveZ = (moveForward ? 1 : 0) - (moveBackward ? 1 : 0) - joyY
			const moveX = (moveRight ? 1 : 0) - (moveLeft ? 1 : 0) + joyX
			const speedMultiplier = isSprinting ? 4 : 1
			const currentSpeed = 80 * speedMultiplier

			if (moveZ !== 0) {
				velocity.add(forward.clone().multiplyScalar(moveZ * currentSpeed * delta))
			}
			if (moveX !== 0) {
				velocity.add(right.clone().multiplyScalar(moveX * currentSpeed * delta))
			}
			if (moveUp) velocity.add(up.clone().multiplyScalar(currentSpeed * delta))
			if (moveDown) velocity.add(up.clone().multiplyScalar(-currentSpeed * delta))

			const nextPos = camera.position.clone().add(
				velocity.clone().multiplyScalar(delta),
			)

			const terrainHeight = simplexNoise(nextPos.x, nextPos.z, seedOffset) - 15

			if (nextPos.y < terrainHeight) {
				nextPos.y = terrainHeight
				velocity.set(0, 0, 0)
			}

			camera.position.copy(nextPos)
			sky.position.copy(camera.position)
			stars.position.copy(camera.position)

			const rainPositions = rainGeo.attributes.position.array
			for (let i = 0; i < rainCount; i++) {
				rainPositions[i * 3 + 1] -= rainVel[i] * delta
				if (rainPositions[i * 3 + 1] < -1) {
					rainPositions[i * 3 + 1] = 100
				}
			}
			rainGeo.attributes.position.needsUpdate = true
			rain.position.copy(camera.position)

			updateChunks()
			updateClouds()
			updateHUD(time)

			renderer.setRenderTarget(renderTarget)
			renderer.render(scene, camera)
			renderer.setRenderTarget(null)
			underwaterMaterial.uniforms.tDiffuse.value = renderTarget.texture
			renderer.render(postScene, postCamera)

			prevTime = now
		}
		animateFixed()

		window.addEventListener('resize', () => {
			camera.aspect = window.innerWidth / window.innerHeight
			camera.updateProjectionMatrix()
			renderer.setSize(window.innerWidth, window.innerHeight)
			renderTarget.setSize(window.innerWidth, window.innerHeight)
		})

		window.addEventListener('pointerlockchange', () => {
			const isLocked = document.pointerLockElement === document.body
			const elements = ['move-joy', 'look-joy', 'height-controls']
			elements.forEach((id) => {
				const el = document.getElementById(id)
				if (el) el.style.display = isLocked ? 'none' : 'block'
			})
		})
		</script>
	</body>
</html>
