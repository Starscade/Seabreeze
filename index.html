<!DOCTYPE html>
<html
	lang="en"
	oncontextmenu="return false"
>
	<head>
		<link
			href="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="
			rel="icon">
		<link
			href="manifest.json"
			rel="manifest"
		>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link
			href="https://fonts.googleapis.com/css2?family=Caacupe+One&display=swap"
			rel="stylesheet">
		<meta charset="UTF-8">
		<meta
			content="Black"
			name="theme-color"
		>
		<meta
			content="initial-scale=1,interactive-widget=resizes-content,maximum-scale=1,user-scalable=no,width=device-width"
			name="viewport"
		>
		<style>
		:root {
			--shadow: 0 0 2px Black;
			--ui-fg: White;
			--ui-bg: #ffffff33;
		}

		body {
			margin: 0;
			overflow: hidden;
			background: #87CEEB;
			font-family: 'Caacupe One', sans-serif;
			font-size: 6vmin;
			touch-action: none;
		}

		canvas {
			display: block;
		}

		.btn {
			width: 60px;
			height: 60px;
			background: var(--ui-bg);
			border: 2px solid var(--ui-fg);
			border-radius: 50%;
			color: var(--ui-fg);
			font-weight: bold;
			display: flex;
			align-items: center;
			justify-content: center;
			text-shadow: var(--shadow);
			user-select: none;
			cursor: pointer;
		}

		.joystick-container {
			position: absolute;
			bottom: 40px;
			width: 120px;
			height: 120px;
			background: var(--ui-bg);
			border-radius: 50%;
			touch-action: none;
			border: 2px solid var(--ui-fg);
			display: none;
		}

		.knob {
			position: absolute;
			top: 35px;
			left: 35px;
			width: 50px;
			height: 50px;
			background: var(--ui-fg);
			border-radius: 50%;
			box-shadow: var(--shadow);
			pointer-events: none;
		}

		#compass {
			font-size: 200%;
			font-weight: bold;
			letter-spacing: 2px;
		}

		#game-clock {
			display: none;
		}

		#height-controls {
			position: absolute;
			right: 40px;
			bottom: 180px;
			display: none;
			flex-direction: column;
			gap: 10px;
		}

		#hud-stats {
			position: absolute;
			top: 1rem;
			left: 50%;
			transform: translateX(-50%);
			color: white;
			text-shadow: var(--shadow);
			pointer-events: none;
			text-align: center;
		}

		#look-joy {
			right: 40px;
		}

		#move-joy {
			left: 40px;
		}

		#intro-overlay {
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			background: black;
			pointer-events: none;
			z-index: 9999;
			mask-image: radial-gradient(circle, transparent 0%, black 0%);
			-webkit-mask-image: radial-gradient(circle, transparent 0%, black 0%);
			transition: opacity 1s ease-out;
		}
		</style>
		<title>&#127758;</title>
	</head>
	<body id="main-body">
		<div id="intro-overlay"></div>
		<div id="hud-stats">
			<div id="compass">N</div>
			<div id="game-clock">00:00</div>
			<div id="altimeter">0m</div>
		</div>

		<div id="move-joy" class="joystick-container">
			<div class="knob" id="move-knob"></div>
		</div>
		<div id="look-joy" class="joystick-container">
			<div class="knob" id="look-knob"></div>
		</div>
		<div id="height-controls">
			<div class="btn" id="btn-jump"></div>
		</div>

		<script defer src="./main.js" type="module"></script>
		<script type="module">
		navigator.serviceWorker.register('work.js')
		</script>
	</body>
</html>
