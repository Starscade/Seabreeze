<!DOCTYPE html>
<html lang="en">
<head>
    <title>GaiaCraft LowPoly</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 1px 1px 2px black; pointer-events: none; font-size: 14px; }
        .joystick-container { 
            position: absolute; 
            bottom: 40px; 
            width: 120px; 
            height: 120px; 
            background: rgba(255,255,255,0.2); 
            border-radius: 50%; 
            touch-action: none;
            border: 2px solid rgba(255,255,255,0.3);
        }
        #move-joy { left: 40px; }
        #look-joy { right: 40px; }
        .knob { 
            position: absolute; 
            top: 35px; 
            left: 35px; 
            width: 50px; 
            height: 50px; 
            background: rgba(255,255,255,0.5); 
            border-radius: 50%; 
            pointer-events: none; 
        }
        #height-controls {
            position: absolute;
            right: 40px;
            bottom: 180px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.3);
            border: 2px solid white;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="ui">WASD/Joy: Move | Q/E: Up/Down</div>
    
    <div id="move-joy" class="joystick-container">
        <div class="knob" id="move-knob"></div>
    </div>
    <div id="look-joy" class="joystick-container">
        <div class="knob" id="look-knob"></div>
    </div>
    <div id="height-controls">
        <div class="btn" id="btn-up">UP</div>
        <div class="btn" id="btn-down">DN</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        
        const vertexShader = `
            varying vec3 vWorldPosition;
            void main() {
                vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                vWorldPosition = worldPosition.xyz;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;
        const fragmentShader = `
            varying vec3 vWorldPosition;
            void main() {
                float h = normalize(vWorldPosition).y;
                vec3 skyColor = vec3(0.529, 0.808, 0.922);
                vec3 horizonColor = vec3(0.7, 0.85, 1.0);
                gl_FragColor = vec4(mix(horizonColor, skyColor, max(h, 0.0)), 1.0);
            }
        `;
        const skyGeo = new THREE.SphereGeometry(500, 32, 15);
        const skyMat = new THREE.ShaderMaterial({ vertexShader, fragmentShader, side: THREE.BackSide });
        const sky = new THREE.Mesh(skyGeo, skyMat);
        scene.add(sky);

        const sunGeo = new THREE.SphereGeometry(5, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xFFFFAA });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        sun.position.set(100, 80, -200);
        sun.material.fog = false;
        scene.add(sun);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.localClippingEnabled = true;
        document.body.appendChild(renderer.domElement);

        scene.fog = new THREE.FogExp2(0x87CEEB, 0.01);
        renderer.setClearColor(0x87CEEB);

        const ambientLight = new THREE.AmbientLight(0xcccccc, 0.8);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight.position.copy(sun.position);
        scene.add(directionalLight);

        const diveLight = new THREE.SpotLight(0xffffff, 150);
        diveLight.distance = 20;
        diveLight.angle = Math.PI / 6;
        diveLight.penumbra = 0.3;
        diveLight.decay = 1;
        diveLight.visible = false;
        scene.add(diveLight);
        scene.add(diveLight.target);

        let yaw = 0, pitch = 0;
        
        // Desktop Mouse Look
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                camera.rotation.set(pitch, yaw, 0, 'YXZ');
            }
        });

        document.body.addEventListener('click', (e) => {
            if (window.innerWidth > 1024) document.body.requestPointerLock();
        });

        function simplexNoise(x, z, seed) {
            return (
                Math.sin(x * 0.05 + seed) * Math.cos(z * 0.05 + seed) * 10 +
                Math.sin(x * 0.2 + seed * 1.1) * Math.cos(z * 0.2 + seed * 1.2) * 5 +
                Math.sin(x * 0.01 + seed * 0.5) * Math.sin(z * 0.01 + seed * 0.8) * 20 +
                Math.cos(x * 0.1 + z * 0.1 + seed) * 8
            );
        }

        const CHUNK_SIZE = 64;
        const CHUNK_RES = 32;
        const RENDER_DISTANCE = 3;
        const chunks = new Map();
        const seedOffset = Math.random() * 1000;
        const colorGrass = new THREE.Color(0x4d8a31);
        const colorSand = new THREE.Color(0xedc9af);
        const colorDirt = new THREE.Color(0x8b4513);

        const terrainClippingPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 1);

        function createChunk(cx, cz) {
            const geo = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE, CHUNK_RES, CHUNK_RES);
            geo.rotateX(-Math.PI / 2);

            const vertices = geo.attributes.position.array;
            const colors = [];
            
            for (let i = 0; i < vertices.length; i += 3) {
                const worldX = vertices[i] + cx * CHUNK_SIZE;
                const worldZ = vertices[i + 2] + cz * CHUNK_SIZE;
                let height = simplexNoise(worldX, worldZ, seedOffset) - 15; 
                vertices[i + 1] = height;

                const c = new THREE.Color();
                if (height > 2) c.copy(colorGrass);
                else if (height > -1) c.copy(colorSand);
                else c.copy(colorDirt);
                colors.push(c.r, c.g, c.b);
            }

            geo.computeVertexNormals();
            geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const mat = new THREE.MeshLambertMaterial({ 
                vertexColors: true, 
                flatShading: true,
                side: THREE.DoubleSide,
                clippingPlanes: [terrainClippingPlane]
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(cx * CHUNK_SIZE, 0, cz * CHUNK_SIZE);
            
            scene.add(mesh);
            return mesh;
        }

        function updateChunks() {
            const px = Math.floor(camera.position.x / CHUNK_SIZE);
            const pz = Math.floor(camera.position.z / CHUNK_SIZE);

            for (let x = px - RENDER_DISTANCE; x <= px + RENDER_DISTANCE; x++) {
                for (let z = pz - RENDER_DISTANCE; z <= pz + RENDER_DISTANCE; z++) {
                    const key = `${x},${z}`;
                    if (!chunks.has(key)) {
                        chunks.set(key, createChunk(x, z));
                    }
                }
            }

            for (const [key, mesh] of chunks.entries()) {
                const [cx, cz] = key.split(',').map(Number);
                if (Math.abs(cx - px) > RENDER_DISTANCE + 1 || Math.abs(cz - pz) > RENDER_DISTANCE + 1) {
                    scene.remove(mesh);
                    mesh.geometry.dispose();
                    mesh.material.dispose();
                    chunks.delete(key);
                }
            }
        }

        camera.position.set(0, 10, 0);

        const waterGeo = new THREE.PlaneGeometry(4000, 4000);
        const waterMat = new THREE.MeshLambertMaterial({ 
            color: 0x001a33, 
            transparent: true, 
            opacity: 0.8,
            side: THREE.DoubleSide 
        });
        const ocean = new THREE.Mesh(waterGeo, waterMat);
        ocean.rotation.x = -Math.PI / 2;
        ocean.position.y = -1;
        scene.add(ocean);

        // Input State
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, moveUp = false, moveDown = false;
        let joyX = 0, joyY = 0; // -1 to 1
        let lookX = 0, lookY = 0; // -1 to 1
        let velocity = new THREE.Vector3();

        // Keyboard
        document.addEventListener('keydown', (e) => {
            if(e.code === 'KeyW') moveForward = true;
            if(e.code === 'KeyS') moveBackward = true;
            if(e.code === 'KeyA') moveLeft = true;
            if(e.code === 'KeyD') moveRight = true;
            if(e.code === 'KeyE') moveUp = true;
            if(e.code === 'KeyQ') moveDown = true;
        });
        document.addEventListener('keyup', (e) => {
            if(e.code === 'KeyW') moveForward = false;
            if(e.code === 'KeyS') moveBackward = false;
            if(e.code === 'KeyA') moveLeft = false;
            if(e.code === 'KeyD') moveRight = false;
            if(e.code === 'KeyE') moveUp = false;
            if(e.code === 'KeyQ') moveDown = false;
        });

        // Joystick Logic
        function setupJoystick(containerId, knobId, callback) {
            const container = document.getElementById(containerId);
            const knob = document.getElementById(knobId);
            let active = false;

            const handleTouch = (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = container.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                const distance = Math.sqrt(dx*dx + dy*dy);
                const maxRadius = rect.width / 2;

                if (distance > maxRadius) {
                    dx *= maxRadius / distance;
                    dy *= maxRadius / distance;
                }

                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                callback(dx / maxRadius, dy / maxRadius);
            };

            container.addEventListener('touchstart', (e) => { active = true; handleTouch(e); });
            container.addEventListener('touchmove', (e) => { if(active) handleTouch(e); });
            container.addEventListener('touchend', () => { 
                active = false; 
                knob.style.transform = `translate(0, 0)`; 
                callback(0, 0); 
            });
        }

        setupJoystick('move-joy', 'move-knob', (x, y) => {
            joyX = x;
            joyY = y;
        });

        setupJoystick('look-joy', 'look-knob', (x, y) => {
            lookX = x;
            lookY = y;
        });

        document.getElementById('btn-up').addEventListener('touchstart', (e) => { e.preventDefault(); moveUp = true; });
        document.getElementById('btn-up').addEventListener('touchend', () => moveUp = false);
        document.getElementById('btn-down').addEventListener('touchstart', (e) => { e.preventDefault(); moveDown = true; });
        document.getElementById('btn-down').addEventListener('touchend', () => moveDown = false);

        let prevTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            
            // Mobile Camera Look
            if (Math.abs(lookX) > 0.1 || Math.abs(lookY) > 0.1) {
                yaw -= lookX * 0.05;
                pitch -= lookY * 0.05;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                camera.rotation.set(pitch, yaw, 0, 'YXZ');
            }

            const isUnderwater = camera.position.y < -1;

            if (isUnderwater) {
                scene.fog = new THREE.FogExp2(0x000b1a, 0.2);
                renderer.setClearColor(0x000b1a);
                sky.visible = false;
                sun.visible = false;
                diveLight.visible = true;
                diveLight.position.copy(camera.position);
                const targetPos = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).add(camera.position);
                diveLight.target.position.copy(targetPos);
                terrainClippingPlane.constant = 1000; 
            } else {
                scene.fog = new THREE.FogExp2(0x87CEEB, 0.01);
                renderer.setClearColor(0x87CEEB);
                sky.visible = true;
                sun.visible = true;
                diveLight.visible = false;
                terrainClippingPlane.constant = -1;
            }

            velocity.x -= velocity.x * 10.0 * delta;
            velocity.y -= velocity.y * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            const up = new THREE.Vector3(0, 1, 0);
            
            // Merge Keyboard and Joystick
            const moveZ = (moveForward ? 1 : 0) - (moveBackward ? 1 : 0) - joyY;
            const moveX = (moveRight ? 1 : 0) - (moveLeft ? 1 : 0) + joyX;
            
            if (moveZ !== 0) velocity.add(forward.clone().multiplyScalar(moveZ * 40 * delta));
            if (moveX !== 0) velocity.add(right.clone().multiplyScalar(moveX * 40 * delta));
            if (moveUp) velocity.add(up.clone().multiplyScalar(40 * delta));
            if (moveDown) velocity.add(up.clone().multiplyScalar(-40 * delta));
            
            camera.position.add(velocity.clone().multiplyScalar(delta));
            
            updateChunks();
            renderer.render(scene, camera);
            prevTime = time;
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
